name: 内容纠错
description: 报告概念、章节、题目、关系或页码问题
title: "[内容纠错] "
labels: [content, "status: needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: 页面地址
      placeholder: https://jennifer-qj.github.io/wenxianxue-lab/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题说明
      description: 请指出具体表述及其问题，不要粘贴原书大段文字。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 核对依据
      description: 可提供书目信息、纸本页码或可靠研究来源。
    validations:
      required: true
  - type: dropdown
    id: evidence_type
    attributes:
      label: 依据类型
      options: [原书纸本, 其他正式出版物, 馆藏目录或机构数据库, 实物或图像观察, 推理与讨论线索]
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 这项依据能够证明到哪一步
      description: 请区分“支持一种可能”“限定时间范围”和“足以确认”等不同强度。
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options: [知识表述, 人名书名年代, 页码与书目信息, 概念关系, 题目答案或解析, 其他]
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改方向
      description: 可以只说明判断方向，不要求提供完整改写。
  - type: dropdown
    id: attribution
    attributes:
      label: 如果建议被采用，如何记录贡献
      options: [公开我的 GitHub 用户名, 记为匿名读者, 不进入网站贡献台账]
    validations:
      required: true
  - type: checkboxes
    id: copyright
    attributes:
      label: 版权确认
      options:
        - label: 我没有上传原书扫描件、自动识别全文或大段受版权保护内容。
          required: true
        - label: 我提交的说明为本人原创或我有权提供，并同意项目在保留贡献记录的前提下整理、修改和采用。
          required: true
