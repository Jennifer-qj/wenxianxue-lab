name: 功能与学习活动建议
description: 建议新的交互、展示、游戏或学习方式
title: "[功能建议] "
labels: [enhancement, "status: needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: 相关页面
      description: 如果是全站建议，可填写“全站”。
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 你遇到的学习或使用问题
      description: 先说明需求，而不只是描述想要的按钮。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: 主要帮助谁
      options: [第一次学习文献学的人, 正在复习的人, 教师或课程组织者, 数字人文项目开发者, 所有人]
    validations:
      required: true
