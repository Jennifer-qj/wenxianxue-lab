items:
  - {id: mku-12-01-01, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 甲骨文的发现, module: M8, page_start: 309, page_end: 312, status: pending_review, key_question: 多种早期记载怎样共同限定甲骨文发现史？, summary: 甲骨在1899年前已于安阳小屯出土并被当作龙骨；王懿荣在1899年识别、购藏带字甲骨，使其作为上古文字进入学术视野，王襄等人也参与早期购藏。, boundary: 刘鹗、罗振常、王国维、王襄和明义士的记载时间、地点与细节并不完全相同，结论应说明依据，不能只复述单一故事。, concept_ids: [c_oracle_bone_text, ev_oracle_discovery, c_archaeological_context], quiz_ids: [q-ch12-001, q-ch12-006], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-02, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 乱掘时期, module: M8, page_start: 312, page_end: 313, status: pending_review, key_question: 早期乱掘给甲骨资料留下了哪些直接缺陷？, summary: 1899至1928年的逐利乱掘使大批甲骨散藏各处，无出土记录与次序，且破碎严重，并伴随数量不小的伪刻。, boundary: 原书没有说乱掘所得全部为伪；缺少来源次序、实物破碎和存在伪刻是三个不同问题。, concept_ids: [c_oracle_bone_text, c_archaeological_context, c_research_boundary], quiz_ids: [q-ch12-002, q-ch12-007], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-03, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 科学发掘时期, module: M8, page_start: 313, page_end: 315, status: pending_review, key_question: 科学发掘怎样让甲骨材料更系统可靠？, summary: 1928年起的科学发掘留下主持者、时间、地点、发掘批次与出土数量；此后按遗迹单位整理材料，使资料来源与同出遗物可以联系研究。, boundary: 科学发掘增强来源链和系统性，但具体数量口径、释字、缀合与断代仍需分别核查。, concept_ids: [me_scientific_excavation, c_archaeological_context, c_evidence_chain], quiz_ids: [q-ch12-003, q-ch12-008], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-04, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 资料结集与考释, module: M8, page_start: 315, page_end: 325, status: pending_review, key_question: 甲骨文资料怎样从分散藏品变成可查检的学术材料？, summary: 甲骨要籍通过拓本或照片公布材料，并逐步加入来源、分期、分类、缀合、辨伪、释文与索引；分类重纂和字典又提供辞例与字形检索。, boundary: 各书体例并不齐备，摹本、描摹、重出、伪刻和旧释都可能影响使用，不能把“已经著录”当成“已经解决”。, concept_ids: [c_oracle_collection, me_epigraphic_rubbing, c_evidence_chain], quiz_ids: [q-ch12-004, q-ch12-007], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-05, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 语言文字与殷商史价值, module: M8, page_start: 325, page_end: 328, status: pending_review, key_question: 甲骨文怎样同时推进文字研究、商史研究与古籍校读？, summary: 甲骨文提供早于小篆的系统字形，可补正《说文》；卜辞又能证明、补充和纠正传世商史，并由地下材料与纸上遗文互释形成二重证据法。, boundary: 原书说《史记·殷本纪》大致可信且仍有小误；“互证”不是让地下材料或传世文献任何一方自动取得绝对权威。, concept_ids: [c_oracle_value, c_oracle_bone_text, c_evidence_chain], quiz_ids: [q-ch12-005, q-ch12-008], lab_ids: [lab-12-case-001]}
  - {id: mku-12-02-01, chapter: 12, chapter_title: 出土文献概述（上）, section: 二、金文文献, subsection: 金文的出土, module: M8, page_start: 328, page_end: 331, status: pending_review, key_question: 研究金文为何必须同时看器物、铭文和出土语境？, summary: 金文主要是青铜器上的铸刻文字；器形、纹饰以及出土地域、地层和同出遗物须与铭文互参，才能先确定年代，再讨论文字和史料价值。, boundary: 专收铭文的汇编和保存器物图像的图谱都属金文文献；脱离器物及语境孤立释读铭文会削弱断代依据。, concept_ids: [c_bronze_inscription, c_archaeological_context, c_version_evidence], quiz_ids: [q-ch12-001, q-ch12-003], lab_ids: [lab-12-case-001]}
  - {id: mku-12-02-02, chapter: 12, chapter_title: 出土文献概述（上）, section: 二、金文文献, subsection: 汇集及考释, module: M8, page_start: 331, page_end: 340, status: pending_review, key_question: 金文要籍的体例差异怎样影响查找与考释？, summary: 历代金文要籍或绘器形、摹拓铭文，或记录尺寸、出土地、藏家与释文，或按器类、字数、王世国别组织；现代集成进一步强调原拓、来源说明、辨伪和索引。, boundary: 图像、摹本、拓本、释文和考释不是可以互相替代的同一种证据，使用时必须先查该书实际提供了哪些层次。, concept_ids: [c_bronze_corpus, me_epigraphic_rubbing, me_provenance_research], quiz_ids: [q-ch12-002, q-ch12-004], lab_ids: [lab-12-case-001]}
  - {id: mku-12-02-03, chapter: 12, chapter_title: 出土文献概述（上）, section: 二、金文文献, subsection: 语言、传世文献与古史价值, module: M8, page_start: 340, page_end: 346, status: pending_review, key_question: 金文怎样连接古文字、传世文献与古史研究？, summary: 金文保存商周字形、韵文和语法材料，可与《说文》《诗》《书》等互相释证、订正文句并辅助判断篇章时代，也能补充封建、战争和王年等古史问题。, boundary: 本章把价值分为语言文字、传世文献考订和古史三类；器铭先要解决真伪与系年，单器材料也不能无条件推广。, concept_ids: [c_bronze_value, c_bronze_inscription, me_tajiao], quiz_ids: [q-ch12-005, q-ch12-006], lab_ids: [lab-12-case-001]}
