items:
  - {id: mku-12-01-01, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 甲骨文的发现, module: M8, page_start: 309, page_end: 312, status: pending_review, key_question: 甲骨怎样从旧物药材转变为学术文献？, summary: 对刻辞的识别、收藏和初步考释使甲骨从流通物进入古文字与历史研究，但早期来源记录往往不足。, boundary: 发现故事与具体材料来源应区分，不能用传说替代可核发掘记录。, concept_ids: [c_oracle_bone_text, ev_oracle_discovery, c_archaeological_context], quiz_ids: [q-ch12-001, q-ch12-006], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-02, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 乱掘时期, module: M8, page_start: 312, page_end: 313, status: pending_review, key_question: 失去出土记录会损失哪些信息？, summary: 乱掘使大量甲骨分散收藏并缺少地层、坑位和组合关系，且伴随破碎和伪刻风险。, boundary: 无科学出土记录不等于材料全伪，但历史解释能力受到限制。, concept_ids: [c_oracle_bone_text, c_archaeological_context, c_research_boundary], quiz_ids: [q-ch12-002, q-ch12-007], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-03, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 科学发掘时期, module: M8, page_start: 313, page_end: 315, status: pending_review, key_question: 科学发掘怎样提升甲骨文证据价值？, summary: 地层、遗迹、共存物和编号记录把单片文字放回考古组合，可支持断代、缀合和历史情境分析。, boundary: 科学记录增强证据链但不自动解决所有释字和年代争议。, concept_ids: [me_scientific_excavation, c_archaeological_context, c_evidence_chain], quiz_ids: [q-ch12-003, q-ch12-008], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-04, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 资料结集与考释, module: M8, page_start: 315, page_end: 325, status: pending_review, key_question: 甲骨整理为什么包括缀合与著录而不只释字？, summary: 著录拓影、来源编号、断片缀合、分类断代和释文互相依赖，共同形成可复核材料库。, boundary: 旧拓和照片受清晰度、拼接与著录错误影响，应尽量核对实物和新影像。, concept_ids: [c_oracle_collection, me_epigraphic_rubbing, c_evidence_chain], quiz_ids: [q-ch12-004, q-ch12-007], lab_ids: [lab-12-case-001]}
  - {id: mku-12-01-05, chapter: 12, chapter_title: 出土文献概述（上）, section: 一、甲骨文文献, subsection: 语言文字与殷商史价值, module: M8, page_start: 325, page_end: 328, status: pending_review, key_question: 占卜记录怎样成为语言与历史材料？, summary: 刻辞保存早期文字、语法、名物、人物、战争、祭祀与社会活动信息，是研究殷商的重要直接材料。, boundary: 占卜文本有固定格式与特定目的，不能等同于完整编年史。, concept_ids: [c_oracle_value, c_oracle_bone_text, c_local_source_bias], quiz_ids: [q-ch12-005, q-ch12-008], lab_ids: [lab-12-case-001]}
  - {id: mku-12-02-01, chapter: 12, chapter_title: 出土文献概述（上）, section: 二、金文文献, subsection: 金文的出土, module: M8, page_start: 328, page_end: 331, status: pending_review, key_question: 研究金文为何必须同时看器物与铭文？, summary: 铭文与器形、纹饰、组合、地点和共存物共同构成断代与功能证据，传世器则常缺少完整语境。, boundary: 仅凭铭文字体或器物市场来源难以建立可靠出土结论。, concept_ids: [c_bronze_inscription, c_archaeological_context, c_version_evidence], quiz_ids: [q-ch12-001, q-ch12-003], lab_ids: [lab-12-case-001]}
  - {id: mku-12-02-02, chapter: 12, chapter_title: 出土文献概述（上）, section: 二、金文文献, subsection: 汇集及考释, module: M8, page_start: 331, page_end: 340, status: pending_review, key_question: 金文著录怎样应对器物流散与释文分歧？, summary: 通过图像、拓本、尺寸、著录史、收藏史和释文对照建立器铭档案，并持续更新断代与释读。, boundary: 摹本和拓本可能失真，著录沿袭也会放大早期错误。, concept_ids: [c_bronze_corpus, me_epigraphic_rubbing, me_provenance_research], quiz_ids: [q-ch12-002, q-ch12-004], lab_ids: [lab-12-case-001]}
  - {id: mku-12-02-03, chapter: 12, chapter_title: 出土文献概述（上）, section: 二、金文文献, subsection: 语言、传世文献与古史价值, module: M8, page_start: 340, page_end: 346, status: pending_review, key_question: 金文怎样校验传世文献和补充古史？, summary: 铭文保存古文字词、册命征伐和宗族关系，可与传世记载互证、订误或揭示不同叙事。, boundary: 铭文也是特定礼仪和政治行为中的文本，应避免把单器叙述无限推广。, concept_ids: [c_bronze_value, c_bronze_inscription, me_tajiao], quiz_ids: [q-ch12-005, q-ch12-006], lab_ids: [lab-12-case-001]}
