items:
  - {id: mku-13-01-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 三、简帛文献, subsection: 战国楚简与曾侯乙简, module: M8, page_start: 346, page_end: 348, status: pending_review, key_question: 不同墓葬楚简为何不能混成一个文本系统？, summary: 湖北、湖南和河南等地战国楚简及曾侯乙墓竹简各有年代、地域、墓葬组合与书写特征，应分批建立档案。, boundary: “楚简”是宽泛类别，具体结论必须落到材料批次和出土单位。, concept_ids: [c_bamboo_silk_text, c_bamboo_silk_discoveries, c_archaeological_context], quiz_ids: [q-ch13-001, q-ch13-006], lab_ids: [lab-13-case-001]}
  - {id: mku-13-01-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 三、简帛文献, subsection: 秦汉墓葬简帛, module: M8, page_start: 348, page_end: 351, status: pending_review, key_question: 墓葬简帛怎样同时保存典籍和行政生活材料？, summary: 云梦、江陵、马王堆、阜阳、银雀山等材料包含法律、医书、术数、兵书和古籍写本，反映多种知识实践。, boundary: 随葬文本不等于墓主亲自撰写或日常全部阅读内容。, concept_ids: [c_bamboo_silk_text, c_bamboo_silk_discoveries, c_local_source_bias], quiz_ids: [q-ch13-002, q-ch13-007], lab_ids: [lab-13-case-001]}
  - {id: mku-13-01-03, chapter: 13, chapter_title: 出土文献概述（下）, section: 三、简帛文献, subsection: 边塞、汉晋与吴简, module: M8, page_start: 351, page_end: 354, status: pending_review, key_question: 日常行政简牍如何重建基层制度？, summary: 武威、居延、敦煌、尹湾、楼兰尼雅和长沙吴简等保存公文、簿籍、信札与法律行政材料。, boundary: 文书具有机构和保存过程偏向，不能把一个遗址的记录直接代表整个时代。, concept_ids: [c_bamboo_silk_discoveries, c_bamboo_silk_text, c_archaeological_context], quiz_ids: [q-ch13-003, q-ch13-008], lab_ids: [lab-13-case-001]}
  - {id: mku-13-02-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 简帛文献的价值, subsection: 佚籍复出与传世古籍校读, module: M8, page_start: 354, page_end: 356, status: pending_review, key_question: 出土本为何会改变我们理解古书的方式？, summary: 佚籍复出扩展古代知识范围，出土异本可揭示传世文本在篇章、文字和思想表述上的长期演变。, boundary: 出土本早出不等于必为作者原本，应视为特定时地的一个文本见证。, concept_ids: [c_excavated_lost_text, c_excavated_variant, me_excavated_transmitted_comparison, c_version], quiz_ids: [q-ch13-001, q-ch13-004], lab_ids: [lab-13-case-001]}
  - {id: mku-13-02-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 简帛文献的价值, subsection: 历史、文字与书籍制度, module: M8, page_start: 356, page_end: 359, status: pending_review, key_question: 简帛实物能回答传世文本不能回答的哪些问题？, summary: 除文字内容外，简长、编绳、分栏、题记和收卷方式提供行政史、文字学及书籍制度史证据。, boundary: 编联复原常受残断和位置扰动影响，应保留多种可能方案。, concept_ids: [c_book_history_artifact, c_bamboo_silk_text, c_archaeological_context], quiz_ids: [q-ch13-005, q-ch13-007], lab_ids: [lab-13-case-001]}
  - {id: mku-13-03-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 四、石刻文献, subsection: 石刻文献要籍, module: M8, page_start: 359, page_end: 363, status: pending_review, key_question: 石刻总集和著录怎样保存散布各地的铭文？, summary: 历代金石著录、碑目、拓本和汇编把分散石刻转化为可检索材料，同时记录存佚与递藏。, boundary: 仅存拓本的石刻需区分原石文字、拓工效果和后人题记。, concept_ids: [c_stone_inscription, me_epigraphic_rubbing, c_bibliography], quiz_ids: [q-ch13-002, q-ch13-006], lab_ids: [lab-13-case-001]}
  - {id: mku-13-03-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 四、石刻文献, subsection: 史料与文学价值, module: M8, page_start: 363, page_end: 365, status: pending_review, key_question: 墓志碑铭怎样补史又为何需要批判阅读？, summary: 石刻可保存人物履历、地名官职、家族和文学作品，但颂德、纪功和丧葬文体会影响叙述。, boundary: 铭文接近事件不等于立场中立，须与史书档案互证。, concept_ids: [c_stone_inscription_value, c_local_source_bias, me_local_source_crosscheck], quiz_ids: [q-ch13-003, q-ch13-008], lab_ids: [lab-13-case-001]}
  - {id: mku-13-03-03, chapter: 13, chapter_title: 出土文献概述（下）, section: 四、石刻文献, subsection: 文字书法、经学与宗教价值, module: M8, page_start: 365, status: pending_review, key_question: 石刻怎样连接文字形体、经典传播与宗教实践？, summary: 原刻与拓本保存字体书法、刻经和宗教题记，可研究文字演变、经典版本与信仰活动。, boundary: 字体风格断代需结合纪年、地域和刻工，不能仅凭审美印象。, concept_ids: [c_stone_inscription_value, me_layout_analysis, c_bronze_value], quiz_ids: [q-ch13-004, q-ch13-005], lab_ids: [lab-13-case-001]}
  - {id: mku-13-04-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 五、其他出土文献, subsection: 盟书、玺印与砖瓦文字, module: M8, page_start: 365, page_end: 366, status: pending_review, key_question: 短小文字材料为何仍能提供制度证据？, summary: 盟书记录盟誓，玺印反映身份与官制，砖瓦文字关联生产、建置和年代，需与实物形制和遗址结合。, boundary: 单字短铭信息密度有限，释读和身份判断尤其需要组合证据。, concept_ids: [c_covenant_text, c_seal_text, c_brick_tile_text, c_archaeological_context], quiz_ids: [q-ch13-002, q-ch13-008], lab_ids: [lab-13-case-001]}
  - {id: mku-13-04-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 五、其他出土文献, subsection: 纸质出土文献, module: M8, page_start: 366, page_end: 368, status: pending_review, key_question: 出土纸文献与传世纸本文献的证据差异是什么？, summary: 纸质出土文献因考古来源可与地层和共存物联系，既保存文本也提供纸张、书写和使用痕迹。, boundary: 出土地点不一定等于制作地点，年代需综合文字、材料和地层判断。, concept_ids: [c_excavated_paper, c_archaeological_context, me_paper_binding_analysis], quiz_ids: [q-ch13-006, q-ch13-007], lab_ids: [lab-13-case-001]}
