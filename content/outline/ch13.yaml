items:
  - {id: mku-13-01-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 三、简帛文献, subsection: 战国楚简与曾侯乙简, module: M8, page_start: 346, page_end: 348, status: pending_review, key_question: 原书怎样按出土地点和批次介绍战国简帛？, summary: 曾侯乙墓竹简多记葬仪车马器物；湖北、湖南、河南所出楚简则包括遣策、占卜和先秦古籍，各批材料的墓葬、数量、内容与整理出版情况并不相同。, boundary: “楚简”只是材料总称；原书逐批列举发现概况，不能据总称把不同出土单位合并成同一文本系统。, concept_ids: [c_bamboo_silk_text, c_bamboo_silk_discoveries, c_archaeological_context], quiz_ids: [q-ch13-001, q-ch13-006], lab_ids: [lab-13-case-001]}
  - {id: mku-13-01-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 三、简帛文献, subsection: 秦汉墓葬简帛, module: M8, page_start: 348, page_end: 351, status: pending_review, key_question: 秦汉墓葬简帛保存了哪些不同类型的文献？, summary: 云梦、江陵秦简和马王堆、阜阳、银雀山等汉代简帛保存律令、历谱、医书、术数、兵书及经子古写本，原书并逐项交代数量、内容与整理本。, boundary: 本节依据出土材料内容分类和说明价值；“随葬文本是否由墓主亲自撰写或阅读”属于网站延伸提醒，并非原书在此作出的判断。, concept_ids: [c_bamboo_silk_text, c_bamboo_silk_discoveries, c_local_source_bias], quiz_ids: [q-ch13-002, q-ch13-007], lab_ids: [lab-13-case-001]}
  - {id: mku-13-01-03, chapter: 13, chapter_title: 出土文献概述（下）, section: 三、简帛文献, subsection: 边塞、汉晋与吴简, module: M8, page_start: 351, page_end: 354, status: pending_review, key_question: 墓葬、边塞遗址与井窖所出简牍各保存了什么？, summary: 武威、居延、敦煌、尹湾、楼兰尼雅和长沙吴简等材料包括经典、诏令、公文、档案、历谱、医方、户籍、券书、信函与账簿，为汉晋和三国史提供大宗新资料。, boundary: 原书分别说明各批材料的地点、时代、数量与内容；把它们概括成统一的“基层制度记录”会遮蔽来源和用途差异。, concept_ids: [c_bamboo_silk_discoveries, c_bamboo_silk_text, c_archaeological_context], quiz_ids: [q-ch13-003, q-ch13-008], lab_ids: [lab-13-case-001]}
  - {id: mku-13-02-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 简帛文献的价值, subsection: 佚籍复出与传世古籍校读, module: M8, page_start: 354, page_end: 356, status: pending_review, key_question: 佚籍复出和古写本对读分别解决什么问题？, summary: 佚籍复出可补充失传著作并回应学术疑问；传世古籍的简帛古写本又可用于考证时代与真伪、校补讹脱和释读文义，原书以孙武、孙膑和《老子》等为例。, boundary: 原书强调出土早本提供可靠新依据；“早出不等于作者原本”是网站为防止证据越界而补充的方法提醒。, concept_ids: [c_excavated_lost_text, c_excavated_variant, me_excavated_transmitted_comparison, c_version], quiz_ids: [q-ch13-001, q-ch13-004], lab_ids: [lab-13-case-001]}
  - {id: mku-13-02-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 简帛文献的价值, subsection: 历史、文字与书籍制度, module: M8, page_start: 356, page_end: 359, status: pending_review, key_question: 简帛从内容和实物两方面提供了哪些证据？, summary: 文书、遣策、历谱和药方构成历史资料，战国秦汉字形补充文字学材料；篇题、书刀、简册收卷方向和简长规格则具体呈现早期书籍制度。, boundary: 原书说明简长规格与汉人记载“有合有不合”，并未给出散简编联的固定复原流程；多方案复原属于网站方法训练。, concept_ids: [c_book_history_artifact, c_bamboo_silk_text, c_archaeological_context], quiz_ids: [q-ch13-005, q-ch13-007], lab_ids: [lab-13-case-001]}
  - {id: mku-13-03-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 四、石刻文献, subsection: 石刻文献要籍, module: M8, page_start: 359, page_end: 363, status: pending_review, key_question: 不同石刻要籍分别提供了哪一层资料？, summary: 从《集古录》《金石录》到墓志、拓本汇编和题跋索引，原书比较目录、录文或拓影、题跋考释、尺寸出处、存佚递藏与检索体例，说明各书用途不同。, boundary: 墨本或拓本、目录、录文和题跋不是同一种证据；使用某部要籍前须先辨明它实际保存了哪些层次。, concept_ids: [c_stone_inscription, me_epigraphic_rubbing, c_bibliography], quiz_ids: [q-ch13-002, q-ch13-006], lab_ids: [lab-13-case-001]}
  - {id: mku-13-03-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 四、石刻文献, subsection: 史料与文学价值, module: M8, page_start: 363, page_end: 365, status: pending_review, key_question: 石刻怎样补史正误并保存文学材料？, summary: 墓碑墓志所载生平可补史传缺载、纠正纪日官职等讹误；碑版传记和石刻诗赋又保存名家文章、文学家事迹及传世总集未收作品。, boundary: 原书以《袁安碑》、荀岳墓志和王之涣墓志等说明互证；“颂德文体影响叙述”属于网站的批判阅读提醒，不冒充本节明说结论。, concept_ids: [c_stone_inscription_value, c_local_source_bias, me_local_source_crosscheck], quiz_ids: [q-ch13-003, q-ch13-008], lab_ids: [lab-13-case-001]}
  - {id: mku-13-03-03, chapter: 13, chapter_title: 出土文献概述（下）, section: 四、石刻文献, subsection: 文字书法、经学与宗教价值, module: M8, page_start: 365, status: pending_review, key_question: 石刻还保存了哪些文字、经典和宗教材料？, summary: 历代碑刻保存古文、篆隶楷及大量别体字和书法材料；历代石经连接经学与金石学，佛经刻石及题记又保存佛教文献和宗教史料。, boundary: 原书在此说明资料类型和研究价值，没有把书法风格单独设为断代方法；断代规则属于网站延伸提示。, concept_ids: [c_stone_inscription, c_stone_inscription_value, c_bibliography], quiz_ids: [q-ch13-004, q-ch13-005], lab_ids: [lab-13-case-001]}
  - {id: mku-13-04-01, chapter: 13, chapter_title: 出土文献概述（下）, section: 五、其他出土文献, subsection: 盟书、玺印与砖瓦文字, module: M8, page_start: 365, page_end: 366, status: pending_review, key_question: 盟书、玺印和砖瓦文字各能研究什么？, summary: 侯马、温县盟书可用于盟誓制度、晋国史和古文字研究；玺印、陶文、封泥关联官制、地理、古文字与篆刻；砖瓦文又能支持文字、民俗、建筑史及遗址墓葬判断。, boundary: 三类材料的载体、内容和用途不同，不能因文字短小便合并使用；原书所列价值也不等于单件材料都能独立证明全部问题。, concept_ids: [c_covenant_text, c_seal_text, c_brick_tile_text, c_archaeological_context], quiz_ids: [q-ch13-002, q-ch13-008], lab_ids: [lab-13-case-001]}
  - {id: mku-13-04-02, chapter: 13, chapter_title: 出土文献概述（下）, section: 五、其他出土文献, subsection: 纸质出土文献, module: M8, page_start: 366, page_end: 368, status: pending_review, key_question: 吐鲁番文书和墓葬古籍怎样提供新的文本证据？, summary: 吐鲁番出土文书包含诏令、符牒、诉状、籍账、契券、书牍和古籍，并有多种文字；鲁荒王墓元版古籍又据同版题记纠正了一部传本被误定为宋刻的判断。, boundary: 原书由个案说明出土本保存原貌较传世本可靠，同时强调利用新证据仍有赖于熟读传世文献；不能泛化为所有出土本必然绝对可靠。, concept_ids: [c_excavated_paper, me_excavated_transmitted_comparison, c_version], quiz_ids: [q-ch13-006, q-ch13-008], lab_ids: [lab-13-case-001]}
