items:
  - {id: mku-05-01-01, chapter: 5, chapter_title: 文献的版本, section: 一、“版本”释义, module: M5, page_start: 104, page_end: 105, status: pending_review, key_question: 版本为什么同时涉及文字与物质形态？, summary: 同一文献在抄写、刊刻和流传中会形成文本内容与制作形态不同的具体本子。, boundary: 版本名称不是价值等级，必须说明所指对象和差异。, concept_ids: [c_version, c_textual_lifecycle], quiz_ids: [q-ch05-001, q-ch05-007], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-01, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （一）写本, module: M5, page_start: 105, page_end: 107, status: pending_review, key_question: 手稿、清稿、抄稿、影钞和抄本怎样区分？, summary: 写本内部可按作者关系、誊清状态、临摹方式和抄写目的继续细分。, boundary: 类别须依据具体书写痕迹和来源，不能只凭旧貌命名。, concept_ids: [c_manuscript, me_paper_binding_analysis], quiz_ids: [q-ch05-002, q-ch05-008], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-02, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （二）刻本, module: M5, page_start: 107, status: pending_review, key_question: 同一版片为何仍可能形成不同印本？, summary: 修版、补版、刷印先后、纸墨和装订会使同版印本出现差异。, boundary: 同版不等于同一保存状态或同等文字质量。, concept_ids: [c_blockprint, c_version], quiz_ids: [q-ch05-003, q-ch05-009], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-03, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （三）套印本, module: M5, page_start: 107, status: pending_review, key_question: 套印本的核心识别特征是什么？, summary: 不同颜色由多块版依次套印，套准情况和分版痕迹可成为观察重点。, boundary: 颜色丰富不必然是套印，也可能后加或手工施彩。, concept_ids: [c_color_print, me_layout_analysis], quiz_ids: [q-ch05-004, q-ch05-010], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-04, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （四）饾版与拱花印本, module: M5, page_start: 107, page_end: 108, status: pending_review, key_question: 分版水印与无墨压印如何协同？, summary: 饾版用多块小版表现色彩层次，拱花借压印形成凹凸纹理。, boundary: 数字图像可能弱化压印起伏，必要时需侧光或实物观察。, concept_ids: [c_embossed_print, me_photographic_reproduction], quiz_ids: [q-ch05-005, q-ch05-011], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-05, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （五）活字本, module: M5, page_start: 108, page_end: 109, status: pending_review, key_question: 活字排印会留下哪些重复与不齐痕迹？, summary: 单字字模重复使用，字形重复、行列不齐和墨色差异可构成识别线索。, boundary: 线索需组合使用，不能见一处歪斜便断为活字本。, concept_ids: [c_movable_type, me_layout_analysis], quiz_ids: [q-ch05-006, q-ch05-012], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-06, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （六）石印本, module: M5, page_start: 109, status: pending_review, key_question: 石印如何改变近代复制效率？, summary: 石印便于转写和缩印，在近代文献传播中形成独特版面与墨色特征。, boundary: 技术类型仍需结合刊记、纸张和著录确认。, concept_ids: [c_lithograph, c_version], quiz_ids: [q-ch05-002, q-ch05-010], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-07, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （七）珂罗版印本, module: M5, page_start: 109, page_end: 110, status: pending_review, key_question: 高仿真复制为何仍不是原件？, summary: 珂罗版能细致复制书画明暗和笔墨外观，适合传播珍贵材料。, boundary: 复制品不能保留全部材质、尺寸和装订证据。, concept_ids: [c_collotype, me_photographic_reproduction], quiz_ids: [q-ch05-004, q-ch05-011], lab_ids: [lab-01-case-001]}
  - {id: mku-05-02-08, chapter: 5, chapter_title: 文献的版本, section: 二、版本类型, subsection: （八）批校本、题跋本, module: M5, page_start: 110, status: pending_review, key_question: 批校题跋怎样增加传本层次？, summary: 读者校语、批注和题跋记录阅读、鉴定和递藏信息，使具体本子具有独特价值。, boundary: 批校者身份和笔迹仍需考证，名人署名可能伪托。, concept_ids: [c_annotated_copy, me_provenance_research], quiz_ids: [q-ch05-005, q-ch05-009], lab_ids: [lab-01-case-001]}
  - {id: mku-05-03-01, chapter: 5, chapter_title: 文献的版本, section: 三、“善本”的界义, subsection: （一）善本的两层含义, module: M5, page_start: 110, page_end: 112, status: pending_review, key_question: “善”究竟指古、稀还是校勘精良？, summary: 善本判断可涉及时代稀见与保存价值，也可强调文字校勘和学术利用价值。, boundary: “旧”“贵”“稀”均不能单独等于“善”。, concept_ids: [c_rare_book, c_research_boundary], quiz_ids: [q-ch05-001, q-ch05-008], lab_ids: [lab-01-case-001]}
  - {id: mku-05-03-02, chapter: 5, chapter_title: 文献的版本, section: 三、“善本”的界义, subsection: （二）四部要籍之精校精注本, module: M5, page_start: 112, page_end: 114, status: pending_review, key_question: 晚出的精校本为何也可能有善本价值？, summary: 学术价值不仅取决于年代，精审校勘、重要注释和可靠整理同样构成善本标准。, boundary: 评价必须公开采用的善本标准与使用目的。, concept_ids: [c_rare_book, me_textual_organization], quiz_ids: [q-ch05-003, q-ch05-007], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-01, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （一）明确撰写年代与（二）细读序跋, module: M5, page_start: 114, page_end: 116, status: pending_review, key_question: 成书年代与刊刻年代为什么必须区分？, summary: 作者活动和成书时间提供上限，序跋可说明刊刻、重修和传承，但须核验真伪与配补。, boundary: 序跋纪年不能自动代表全书同一制作阶段。, concept_ids: [me_preface_colophon, c_version_evidence], quiz_ids: [q-ch05-006, q-ch05-012], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-02, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （三）验牌记, module: M5, page_start: 116, page_end: 118, status: pending_review, key_question: 牌记为什么既重要又可能误导？, summary: 牌记可提供刊刻者、地点和年代，但可能后配、翻刻或伪造。, boundary: 必须检查牌记所在书叶与全书纸墨版式是否一致。, concept_ids: [me_colophon_mark, c_version_evidence], quiz_ids: [q-ch05-002, q-ch05-009], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-03, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （四）查避讳, module: M5, page_start: 118, page_end: 119, status: pending_review, key_question: 避讳证据通常能推出多强的年代结论？, summary: 避讳字形可提示某一时间下限或修版活动，需排除偶然缺笔、翻刻和挖改。, boundary: 单一避讳通常只能提示“不会早于”，不能独立锁定刊年。, concept_ids: [me_taboo_character, c_version_evidence], quiz_ids: [q-ch05-004, q-ch05-010], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-04, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （五）考刻工与（六）核校阅人时代, module: M5, page_start: 119, page_end: 126, status: pending_review, key_question: 人物活动年代如何成为刊刻旁证？, summary: 刻工和校阅人的可考活动时地可限定版本范围，并帮助识别版片来源。, boundary: 同名异人、沿用旧版和后补书叶会削弱单项人物证据。, concept_ids: [me_engraver, c_textual_agent, c_version_evidence], quiz_ids: [q-ch05-005, q-ch05-011], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-05, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （七）看字体与（八）看版式, module: M5, page_start: 126, page_end: 128, status: pending_review, key_question: 字体版式为什么适合比较而不宜孤证断代？, summary: 字形、行款、边栏、版心和鱼尾等特征可与可靠同类版本比较。, boundary: 仿刻与地区差异会造成相似或错位，类型印象不能替代证据链。, concept_ids: [me_layout_analysis, c_version_evidence], quiz_ids: [q-ch05-006, q-ch05-012], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-06, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （九）看纸张至（十一）查藏印, module: M5, page_start: 128, page_end: 130, status: pending_review, key_question: 纸张、装潢和藏印分别说明什么？, summary: 纸张与装潢反映制作和后改，藏印反映收藏阶段，三者证据对象不同。, boundary: 旧纸后用、后改装和伪印都要求与其他线索互证。, concept_ids: [me_paper_binding_analysis, me_provenance_research, c_version_evidence], quiz_ids: [q-ch05-003, q-ch05-008], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-07, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （十二）类比、（十三）查著录与（十四）求旁证, module: M5, page_start: 129, page_end: 133, status: pending_review, key_question: 外部比较怎样支持版本判断？, summary: 与可靠同类本比较，并查目录著录和相关材料，可检验孤立观察是否成立。, boundary: 类比对象必须来源可靠且具有可比性，著录也可能沿袭错误。, concept_ids: [me_catalog_comparison, c_version_evidence, c_evidence_chain], quiz_ids: [q-ch05-001, q-ch05-007], lab_ids: [lab-01-case-001]}
  - {id: mku-05-04-08, chapter: 5, chapter_title: 文献的版本, section: 四、版本鉴定, subsection: （十五）对书影, module: M5, page_start: 133, page_end: 134, status: pending_review, key_question: 书影比较能完成和不能完成什么？, summary: 可靠书影可比较版面、字形与版片特征，帮助远程初筛和识别同版关系。, boundary: 书影受裁切、清晰度和色彩影响，涉及纸张装订时仍需实物核验。, concept_ids: [me_catalog_comparison, me_photographic_reproduction, c_research_boundary], quiz_ids: [q-ch05-002, q-ch05-010], lab_ids: [lab-01-case-001]}

