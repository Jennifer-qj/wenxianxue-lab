items:
  - {id: mku-10-01-01, chapter: 10, chapter_title: 地方志与家谱, section: 一、地方志, subsection: 地方志的产生, module: M8, page_start: 266, page_end: 268, status: pending_review, key_question: 地方记载怎样发展为综合性方志？, summary: 早期地理、图经和地方记录逐步融合建置、人物、风俗与艺文等内容，形成较稳定的方志体例。, boundary: 后世成熟方志的栏目不能无条件投射到早期地方文献。, concept_ids: [c_local_gazetteer, c_gazetteer_type], quiz_ids: [q-ch10-001, q-ch10-007], lab_ids: [lab-10-case-001]}
  - {id: mku-10-01-02, chapter: 10, chapter_title: 地方志与家谱, section: 一、地方志, subsection: 历代地方志的数量与存佚, module: M8, page_start: 268, page_end: 270, status: pending_review, key_question: 方志数量统计为什么必须注明口径？, summary: 宋元方志可考者多而现存少，明清数量与存世规模大增，民国及新方志又形成不同时间范围；“可考”“现存”“残存”和“出版”必须分开统计。, boundary: 书目中的一种不能自动等于现存一部完整实体，不同时期统计也不能在缺少口径说明时直接相加。, concept_ids: [c_local_gazetteer, c_document_loss], quiz_ids: [q-ch10-002, q-ch10-006], lab_ids: [lab-10-case-001]}
  - {id: mku-10-01-03, chapter: 10, chapter_title: 地方志与家谱, section: 一、地方志, subsection: 总志、省志、府州厅县志, module: M8, page_start: 270, page_end: 273, status: pending_review, key_question: 行政层级如何决定方志覆盖范围？, summary: 总志到县志按地域与行政层级逐步收缩，资料粒度、编纂责任和时间跨度随之变化。, boundary: 行政区划不断改变，不能用今天的辖域直接解释旧志范围。, concept_ids: [c_gazetteer_type, c_administrative_geography], quiz_ids: [q-ch10-003, q-ch10-008], lab_ids: [lab-10-case-001]}
  - {id: mku-10-01-04, chapter: 10, chapter_title: 地方志与家谱, section: 一、地方志, subsection: 乡镇、都邑、卫所、边关、土司、盐井与专志, module: M8, page_start: 273, page_end: 274, status: pending_review, key_question: 行政区之外还有哪些地方志分支与变种？, summary: 乡镇、城市、明代卫所、边关、土司辖区、盐井以及名胜、寺院、金石等特殊区域或门类，都可能成为独立志书的著录对象。, boundary: “志”所覆盖的空间或专题层级并不一致，必须先由题名、凡例和栏目核定实际对象。, concept_ids: [c_gazetteer_type, c_local_gazetteer], quiz_ids: [q-ch10-003, q-ch10-005], lab_ids: [lab-10-case-001]}
  - {id: mku-10-01-05, chapter: 10, chapter_title: 地方志与家谱, section: 一、地方志, subsection: 地方志的用途, module: M8, page_start: 274, page_end: 278, status: pending_review, key_question: 地方志怎样从治理手册转化为多学科史料入口？, summary: 地方志可供治理一方、考察地理沿革、辅助文学创作与搜集诗文，也是政治经济、人物、宗教、灾害、物产等地方历史资料的渊薮。, boundary: 原书着重说明方志价值；网站进一步提醒，引用具体记载仍应核对修纂时代、材料出处和不同版本，重要结论尽可能与其他材料互证。, concept_ids: [c_gazetteer_value, c_local_source_bias, me_local_source_crosscheck], quiz_ids: [q-ch10-004, q-ch10-006], lab_ids: [lab-10-case-001]}
  - {id: mku-10-02-01, chapter: 10, chapter_title: 地方志与家谱, section: 二、家谱, subsection: 家谱的起源与发展, module: M8, page_start: 278, page_end: 282, status: pending_review, key_question: 家谱怎样从官修通谱转向私修宗谱？, summary: 早期谱牒服务帝王世系、门第、选官和婚姻，唐代政治作用逐渐降低、伦理作用提高；宋代以后官修通谱衰落，私家修谱成为主流并形成欧阳修、苏洵等谱式。, boundary: 传统家谱以男子为世系主干，妇女多附于父亲或丈夫；远祖、旁支与缺代的可靠性还须结合谱序、谱例和外部材料判断。, concept_ids: [c_genealogy, c_genealogical_lineage, c_local_source_bias], quiz_ids: [q-ch10-001, q-ch10-008], lab_ids: [lab-10-case-001]}
  - {id: mku-10-02-02, chapter: 10, chapter_title: 地方志与家谱, section: 二、家谱, subsection: 世系、世系录、谱序与谱例, module: M8, page_start: 282, page_end: 283, status: pending_review, key_question: 怎样阅读家谱的关系结构与编纂规则？, summary: 世系和世系录呈现代际关系，谱序说明修谱缘起，谱例规定收录、书写和伦理标准。, boundary: 谱图的整齐结构可能掩盖缺代、续接和不同支系争议。, concept_ids: [c_genealogical_lineage, c_genealogy_structure], quiz_ids: [q-ch10-002, q-ch10-007], lab_ids: [lab-10-case-001]}
  - {id: mku-10-02-03, chapter: 10, chapter_title: 地方志与家谱, section: 二、家谱, subsection: 恩荣、像赞、传志、家训、文献与修谱记录, module: M8, page_start: 283, page_end: 284, status: pending_review, key_question: 家谱除世系外还保存哪些材料？, summary: 恩荣录、像赞、传志、懿行、家训、诗文、坟墓祠堂图及修谱人员和领谱字号共同记录宗族制度与文化。, boundary: 表彰性篇章具有明确价值取向，事实使用时需寻找同时代旁证。, concept_ids: [c_genealogy_structure, c_local_source_bias], quiz_ids: [q-ch10-004, q-ch10-005], lab_ids: [lab-10-case-001]}
  - {id: mku-10-02-04, chapter: 10, chapter_title: 地方志与家谱, section: 二、家谱, subsection: 家谱的价值与存佚, module: M8, page_start: 284, page_end: 289, status: pending_review, key_question: 家谱怎样用于人口、移民和宗族研究？, summary: 通过跨代世系、居地、婚姻、生卒和迁徙记录，家谱可补充人物传记、诗文、人口史、移民史与宗族制度研究。, boundary: 女性、旁支和贫弱成员可能记录不足，统计前必须评估收录规则和缺失机制。, concept_ids: [c_genealogy_value, me_local_source_crosscheck, c_local_source_bias], quiz_ids: [q-ch10-006, q-ch10-008], lab_ids: [lab-10-case-001]}
