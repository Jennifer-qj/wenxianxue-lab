items:
  - {id: mku-08-01-01, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 一、辑佚, subsection: 古书亡佚及其原因, module: M7, page_start: 176, page_end: 178, status: pending_review, key_question: 亡佚为何是多种历史过程共同造成的？, summary: 战乱、禁毁、载体损坏、收藏变化、传播中断和后世取舍都会使文献全佚或残佚。, boundary: 今不见其书不等于从未存在，应先核查目录、引文和出土材料。, concept_ids: [c_lost_work, c_document_loss], quiz_ids: [q-ch08-001, q-ch08-006], lab_ids: [lab-08-case-001]}
  - {id: mku-08-01-02, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 一、辑佚, subsection: 前人辑佚的成绩, module: M7, page_start: 178, page_end: 180, status: pending_review, key_question: 辑本为什么既能保存文献又必须重新校核？, summary: 历代辑佚使大量佚文重新集中，但材料搜集范围、出处识别和校订质量各不相同。, boundary: 辑本是研究性重建而非原书复活，不能隐去辑者的选择。, concept_ids: [c_reconstruction, c_lost_work], quiz_ids: [q-ch08-002, q-ch08-010], lab_ids: [lab-08-case-001]}
  - {id: mku-08-01-03, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 一、辑佚, subsection: 辑佚的方法, module: M7, page_start: 180, page_end: 182, status: pending_review, key_question: 怎样从散见引文重建一部亡书？, summary: 先核定书名篇卷，再搜集引文、辨别真伪和重复，按可解释体例编排并逐条标注出处。, boundary: 不可为追求完整而把疑似材料无说明地拼入正文。, concept_ids: [me_reconstruction_workflow, c_reconstruction, c_evidence_chain], quiz_ids: [q-ch08-003, q-ch08-007], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-01, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 伪书的界定, module: M7, page_start: 182, page_end: 183, status: pending_review, key_question: 哪些身份问题会使文献被称为伪书？, summary: 伪可涉及作者、时代、来源或整体身份，也可能只发生于序跋、篇章和局部窜入。, boundary: 文字错误、后世整理和匿名本身都不等于有意作伪。, concept_ids: [c_forged_work, c_authentication_conclusion], quiz_ids: [q-ch08-001, q-ch08-008], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-02, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 作伪的动机, module: M7, page_start: 183, page_end: 186, status: pending_review, key_question: 作伪动机如何帮助解释文献而非代替证据？, summary: 传道、牟利、求名、争胜、避禁和避嫌可解释为何假托，但是否作伪仍须文本与传承证据证成。, boundary: 推测作者可能获利不能单独证明文献为伪。, concept_ids: [c_forgery_motive, c_forged_work], quiz_ids: [q-ch08-004, q-ch08-009], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-03, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 作伪的主要手段, module: M7, page_start: 186, page_end: 189, status: pending_review, key_question: 伪书如何借用旧作者、旧名和旧材料制造可信外观？, summary: 假托、改题、去真序、造伪序、袭名、节采、缀合、自注和以假搀真等方式可单独或组合使用。, boundary: 沿用旧名或汇编旧材料不必然作伪，关键是是否虚构身份并误导读者。, concept_ids: [c_forgery_technique, c_forged_work], quiz_ids: [q-ch08-002, q-ch08-005], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-04, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 我国辨伪的历史, module: M7, page_start: 189, page_end: 203, status: pending_review, key_question: 辨伪为什么是一项不断修正的学术传统？, summary: 历代目录家、史家和考据学者逐步积累从著录、传承到文本内部的辨伪方法，结论也随新材料而变化。, boundary: 前人成说是证据史的一部分，不能只凭权威姓名直接继承结论。, concept_ids: [c_forged_work, c_authentication_conclusion], quiz_ids: [q-ch08-006, q-ch08-010], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-05, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 授受、依托者与传出者, module: M7, page_start: 203, page_end: 205, status: pending_review, key_question: 一部古书突然出现时应怎样检查传承链？, summary: 核查师承授受、被依托者生平、最初传出者及同时代记录，可发现来源断裂或身份矛盾。, boundary: 著录缺失只是疑点，材料散佚也可能造成传承链空白。, concept_ids: [me_provenance_authentication, c_forged_work], quiz_ids: [q-ch08-003, q-ch08-007], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-06, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 文体、风格、语词、声韵、因袭与称引, module: M7, page_start: 206, page_end: 210, status: pending_review, key_question: 语言特征如何形成可检验的年代下限？, summary: 后起文体、语词或声韵现象以及对晚出文献的因袭、称引，可与所托时代发生矛盾。, boundary: 传抄改写和后人润饰可能造成局部晚出特征，应判断证据覆盖范围。, concept_ids: [me_linguistic_authentication, c_authentication_conclusion], quiz_ids: [q-ch08-004, q-ch08-008], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-07, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 史实、称谓、制度与地理沿革, module: M7, page_start: 210, page_end: 213, status: pending_review, key_question: 时间错置为什么是辨伪强证据？, summary: 文本若使用所托时代尚不存在的事件知识、官名制度或地名沿革，就形成需要解释的时代矛盾。, boundary: 后世传抄替换称谓也可能造成局部错置，不能自动推及全书皆伪。, concept_ids: [me_historical_authentication, c_authentication_conclusion], quiz_ids: [q-ch08-005, q-ch08-009], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-08, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 思想、学术水平与发展次序, module: M7, page_start: 213, page_end: 214, status: pending_review, key_question: 怎样避免用刻板印象判断作者思想？, summary: 可比较文本与作者行事、思想立场、专长及学术发展阶段，但须依赖可靠同时代材料并容纳思想变化。, boundary: “不像某人会写”不是证据，必须指出具体、可核验的时代矛盾。, concept_ids: [me_intellectual_authentication, c_authentication_conclusion], quiz_ids: [q-ch08-007, q-ch08-010], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-09, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 伪书的价值与案例, module: M7, page_start: 214, page_end: 219, status: pending_review, key_question: 确认为伪后为什么仍要保存和研究？, summary: 伪书不能作为所托时代的直接材料，却可反映实际成书时代的历史、文学、语言、思想和接受情况。, boundary: 承认后世价值不能倒转其年代，也不能继续按伪托身份引用。, concept_ids: [c_forged_work_value, c_forged_work, c_research_boundary], quiz_ids: [q-ch08-008, q-ch08-009], lab_ids: [lab-08-case-001]}
