items:
  - {id: mku-08-01-01, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 一、辑佚, subsection: 古书亡佚及其原因, module: M7, page_start: 176, page_end: 178, status: pending_review, key_question: 兵火与自然淘汰怎样共同造成古书亡佚？, summary: 兵火书厄会直接毁书，流传副本稀少的书尤其危险；官修新书取代旧作、作品失去重视等自然淘汰，也会使文献逐步退出传播。, boundary: 传世史料只是原有文献的一小部分，断言某时代“没有某现象”或某现象“始于某时”都应保留史料不足的限制。, concept_ids: [c_lost_work, c_document_loss], quiz_ids: [q-ch08-001, q-ch08-006], lab_ids: [lab-08-case-001]}
  - {id: mku-08-01-02, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 一、辑佚, subsection: 前人辑佚的成绩, module: M7, page_start: 178, page_end: 180, status: pending_review, key_question: 前人怎样把散见佚文重新汇成可用材料？, summary: 宋人已从群书辑出亡书，清代四库馆臣又从《永乐大典》大规模辑书，马国翰、黄奭、严可均等人的成果以及近现代新辑本持续扩展了可用材料。, boundary: 辑本是据现存引文形成的研究成果，收录范围、出处标注和校订质量仍须逐条检查，不能等同原书复活。, concept_ids: [c_reconstruction, c_lost_work], quiz_ids: [q-ch08-002, q-ch08-010], lab_ids: [lab-08-case-001]}
  - {id: mku-08-01-03, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 一、辑佚, subsection: 辑佚的方法, module: M7, page_start: 180, page_end: 182, status: pending_review, key_question: 怎样从散见引文重建一部亡书？, summary: 从古注、类书、小学书、古籍和总集广搜佚文，辨清节引、撮述、重复与误引，再依原书体例排纂、校勘异文并逐条注明出处。, boundary: 辑佚不只求多；若不辨引文起讫、原书体例和文字真伪，仍可能把原书正文误作佚文或把节引拆成数条。, concept_ids: [me_reconstruction_workflow, c_reconstruction, c_evidence_chain], quiz_ids: [q-ch08-003, q-ch08-007], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-01, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 伪书的界定, module: M7, page_start: 182, page_end: 183, status: pending_review, key_question: 原书所说的“伪书”以什么身份错配为界？, summary: 一书公认的著者及时代并非真正著者及时代，才属于本章所说的伪书；作伪既可能有意，也可能无意形成。, boundary: 书中夹有虚假史料，或书商把明刊本冒充宋本，都不属于这里的“伪书”概念，须与史料真伪和版本作伪分开。, concept_ids: [c_forged_work, c_authentication_conclusion], quiz_ids: [q-ch08-001, q-ch08-008], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-02, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 作伪的动机, module: M7, page_start: 183, page_end: 186, status: pending_review, key_question: 作伪动机如何帮助解释文献而非代替证据？, summary: 传道、牟利、求名、争胜、避禁和避嫌可解释为何假托，但是否作伪仍须文本与传承证据证成。, boundary: 推测作者可能获利不能单独证明文献为伪。, concept_ids: [c_forgery_motive, c_forged_work], quiz_ids: [q-ch08-004, q-ch08-009], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-03, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 作伪的主要手段, module: M7, page_start: 186, page_end: 189, status: pending_review, key_question: 伪书如何借用旧作者、旧名和旧材料制造可信外观？, summary: 作者假托、后人改题、割去或伪撰序跋、沿袭旧名、节采或缀合群书、变乱旧例、自著自注、以篆籀充古本和以假搀真等手段可单独或组合使用。, boundary: 沿用旧名、汇编旧材料或自著自注本身不必然构成伪书，须考察它们是否被用来造成虚假的著者与时代身份。, concept_ids: [c_forgery_technique, c_forged_work], quiz_ids: [q-ch08-002, q-ch08-005], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-04, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 我国辨伪的历史, module: M7, page_start: 189, page_end: 203, status: pending_review, key_question: 辨伪为什么是一项不断修正的学术传统？, summary: 历代目录家、史家和考据学者逐步积累从著录、传承到文本内部的辨伪方法，结论也随新材料而变化。, boundary: 前人成说是证据史的一部分，不能只凭权威姓名直接继承结论。, concept_ids: [c_forged_work, c_authentication_conclusion], quiz_ids: [q-ch08-006, q-ch08-010], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-05, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 授受、依托者、传出者、行事与当世揭发, module: M7, page_start: 203, page_end: 205, status: pending_review, key_question: 怎样从来源链和人物记录发现伪书疑点？, summary: 核查授受源流、常被依托者、最初传出者、文本与作者行事的矛盾及当世人的揭发，可发现来源断裂、身份错配或同时代反证。, boundary: 查源流和人物最能发现问题，却仍需进一步证据；行事矛盾也须分清写实与想象，不能绝对化。, concept_ids: [me_provenance_authentication, c_forged_work], quiz_ids: [q-ch08-003, q-ch08-007], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-06, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 文体、风格、语词、声韵、因袭、称引与佚文, module: M7, page_start: 206, page_end: 210, status: pending_review, key_question: 文本内部线索怎样限定一书的时代与真伪？, summary: 后起文体、风格、特殊语词或声韵系统，以及因袭晚书、称引错序、早期佚文与今本不合，都可暴露所托时代与文本形成过程的矛盾。, boundary: 个别词语只是有力佐证，声韵只能划定大体年代；称引矛盾还须区分全书皆伪、后人辑本与局部窜入。, concept_ids: [me_linguistic_authentication, c_authentication_conclusion], quiz_ids: [q-ch08-004, q-ch08-008], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-07, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 史实、称谓、制度与地理沿革, module: M7, page_start: 210, page_end: 213, status: pending_review, key_question: 时间错置为什么是辨伪强证据？, summary: 文本若使用所托时代尚不存在的事件知识、官名制度或地名沿革，就形成需要解释的时代矛盾。, boundary: 后世传抄替换称谓也可能造成局部错置，不能自动推及全书皆伪。, concept_ids: [me_historical_authentication, c_authentication_conclusion], quiz_ids: [q-ch08-005, q-ch08-009], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-08, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 思想、学术水平与发展次序, module: M7, page_start: 213, page_end: 214, status: pending_review, key_question: 怎样避免用刻板印象判断作者思想？, summary: 可比较文本与作者行事、思想立场、专长及学术发展阶段，但须依赖可靠同时代材料并容纳思想变化。, boundary: “不像某人会写”不是证据，必须指出具体、可核验的时代矛盾。, concept_ids: [me_intellectual_authentication, c_authentication_conclusion], quiz_ids: [q-ch08-007, q-ch08-010], lab_ids: [lab-08-case-001]}
  - {id: mku-08-02-09, chapter: 8, chapter_title: 文献的辑佚与辨伪, section: 二、辨伪, subsection: 伪书的价值与案例, module: M7, page_start: 214, page_end: 219, status: pending_review, key_question: 确认为伪后为什么仍要保存和研究？, summary: 伪书不能作为所托时代的直接材料，却可反映实际成书时代的历史、文学、语言、思想和接受情况。, boundary: 承认后世价值不能倒转其年代，也不能继续按伪托身份引用。, concept_ids: [c_forged_work_value, c_forged_work, c_research_boundary], quiz_ids: [q-ch08-008, q-ch08-009], lab_ids: [lab-08-case-001]}
