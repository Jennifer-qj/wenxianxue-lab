items:
  - {id: mku-04-01-01, chapter: 4, chapter_title: 文献的收藏与散佚, section: 一、历代官府藏书及其散佚, subsection: （一）历代官府文献收藏概况, module: M4, page_start: 56, page_end: 64, status: pending_review, key_question: 官藏如何建立文献秩序？, summary: 官府通过征集、校理、编目和专门机构集中保存文献，形成制度化知识资源。, boundary: 进入官藏不等于永久安全，也不等于版本必然精善。, concept_ids: [c_official_collection, c_collection_catalog], quiz_ids: [q-ch04-001, q-ch04-007], lab_ids: []}
  - {id: mku-04-01-02, chapter: 4, chapter_title: 文献的收藏与散佚, section: 一、历代官府藏书及其散佚, subsection: （二）历代文献的大量散佚, module: M4, page_start: 64, page_end: 69, status: pending_review, key_question: 为什么集中收藏仍会反复遭遇大规模散佚？, summary: 战乱、火灾、禁毁和制度崩解使集中收藏面临单点损失，文献存世具有强烈历史偶然性。, boundary: 事件清单说明风险类型，具体损失数量仍需分别核验史料。, concept_ids: [c_document_loss, c_disaster_risk, ev_war_loss, ev_qianlong_destruction], quiz_ids: [q-ch04-002, q-ch04-008], lab_ids: []}
  - {id: mku-04-02-01, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （一）周秦私家藏书概况, module: M4, page_start: 69, page_end: 70, status: pending_review, key_question: 私人收藏如何补充公共保存？, summary: 私人持有和传授使部分文献在官方体系之外延续，并形成早期知识网络。, boundary: 早期记载有限，不能以少量人物代表全部收藏生态。, concept_ids: [c_private_collection, c_collection_provenance], quiz_ids: [q-ch04-003, q-ch04-009], lab_ids: []}
  - {id: mku-04-02-02, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （二）汉魏晋南北朝的私人藏书, module: M4, page_start: 70, page_end: 71, status: pending_review, key_question: 动荡时代私藏承担了什么作用？, summary: 私人访求、抄写和家族传递既保存文献，也受战争和家族兴替影响。, boundary: 名家旧藏是源流线索，不自动证明文本真伪与质量。, concept_ids: [c_private_collection, c_disaster_risk, me_provenance_research], quiz_ids: [q-ch04-004, q-ch04-010], lab_ids: []}
  - {id: mku-04-02-03, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （三）唐宋私家藏书, module: M4, page_start: 71, page_end: 73, status: pending_review, key_question: 印刷发展如何改变私家收藏？, summary: 书籍复制和流通扩大推动私藏规模、目录记录和校勘活动发展。, boundary: 印刷增加供给不等于文献均匀保存，稀见材料仍可能散佚。, concept_ids: [c_private_collection, c_collection_catalog, me_printing], quiz_ids: [q-ch04-005, q-ch04-011], lab_ids: []}
  - {id: mku-04-02-04, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （四）元明私家藏书, module: M4, page_start: 73, page_end: 79, status: pending_review, key_question: 藏书楼与目录怎样共同塑造收藏记忆？, summary: 藏书空间、题跋、藏印和目录让收藏体系获得可追踪的身份与传承记录。, boundary: 藏印可能伪刻或后钤，必须与目录、题跋和纸墨互证。, concept_ids: [c_private_collection, c_collection_catalog, me_provenance_research], quiz_ids: [q-ch04-006, q-ch04-012], lab_ids: []}
  - {id: mku-04-02-05, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （五）清代著名藏书家（上）, module: M4, page_start: 79, page_end: 89, status: pending_review, key_question: 清代藏书活动为何与校勘整理密切结合？, summary: 访书、抄校、刻印和编目使收藏者同时成为文献整理与传播参与者。, boundary: 收藏家的题跋判断仍是待复核意见，不能因名望直接采信。, concept_ids: [c_private_collection, me_provenance_research, me_textual_organization], quiz_ids: [q-ch04-003, q-ch04-010], lab_ids: []}
  - {id: mku-04-02-06, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （六）清代著名藏书家（下）, module: M4, page_start: 89, page_end: 98, status: pending_review, key_question: 收藏网络如何影响版本流传？, summary: 藏家之间的借抄、交换、购求和刻印使版本沿关系网络迁移并产生新副本。, boundary: 递藏链存在空缺时应明确标为待考，不宜用想象补齐。, concept_ids: [c_collection_provenance, me_provenance_research, c_evidence_chain], quiz_ids: [q-ch04-004, q-ch04-009], lab_ids: []}
  - {id: mku-04-02-07, chapter: 4, chapter_title: 文献的收藏与散佚, section: 二、历代私家藏书之兴替, subsection: （七）近代著名藏书家, module: M4, page_start: 98, page_end: 104, status: pending_review, key_question: 近代制度变化如何重组古籍收藏？, summary: 战乱、市场、公共图书馆和学术机构共同推动私藏流散、转让及进入公藏。, boundary: 从私藏转为公藏并不意味着来源问题消失，仍需保存旧有递藏信息。, concept_ids: [c_private_collection, c_official_collection, c_collection_provenance, c_preservation_strategy], quiz_ids: [q-ch04-005, q-ch04-012], lab_ids: []}

