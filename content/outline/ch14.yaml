items:
  - {id: mku-14-01-01, chapter: 14, chapter_title: 敦煌文献概述, section: 一、敦煌、敦煌石窟、莫高窟与藏经洞, module: M8, page_start: 368, page_end: 371, status: pending_review, key_question: 敦煌、敦煌石窟、莫高窟和藏经洞分别指什么？, summary: 敦煌是河西走廊西端的城市与历史区域，敦煌石窟是八处石窟的总称，莫高窟是其中的代表；藏经洞原为洪晉影堂，是莫高窟第十六窟的耳洞、今编号第十七窟。, boundary: 城市区域、石窟群、具体遗址与其中一座洞窟是四个层级，不能把“敦煌”直接等同于藏经洞。, concept_ids: [c_dunhuang, c_mogao_caves, c_library_cave], quiz_ids: [q-ch14-001, q-ch14-006], lab_ids: [lab-14-case-001]}
  - {id: mku-14-02-01, chapter: 14, chapter_title: 敦煌文献概述, section: 二、敦煌石室的发现及文献流散, subsection: 藏经洞的发现, module: M8, page_start: 371, page_end: 372, status: pending_review, key_question: 原书为什么采用1900年为藏经洞发现年？, summary: 《王道士荐疏》和光绪三十二年功德碑均与王圆禄本人直接相关，且多种较早记述同指光绪庚子；1931年墓志所记光绪二十五年因形成较晚，可信度较低。, boundary: 发现日期的判断来自史料形成时间和当事人关系比较，不应只复述一条后来墓志或流行故事。, concept_ids: [ev_library_cave_discovery, c_library_cave, c_archaeological_context], quiz_ids: [q-ch14-002, q-ch14-007], lab_ids: [lab-14-case-001]}
  - {id: mku-14-02-02, chapter: 14, chapter_title: 敦煌文献概述, section: 二、敦煌石室的发现及文献流散, subsection: 封闭时间与原因, module: M8, page_start: 372, page_end: 375, status: pending_review, key_question: 废弃说、避难说和荣新江解释各依据什么？, summary: 斯坦因据残经废纸等提出废弃说，伯希和据最晚纪年、无西夏文本和所见凌乱提出避难说；荣新江依据早期包裹记录、卷帙制度、三界寺标记及1002年后历史，认为文物有序封存以应对于阗覆亡后的威胁。, boundary: 1002年题记只能给出封闭时间下限；原书认为荣说更有说服力并赞许其方法，但没有把推测写成无争议定论。, concept_ids: [c_library_cave, c_authentication_conclusion, c_suspensive_judgment], quiz_ids: [q-ch14-003, q-ch14-008], lab_ids: [lab-14-case-001]}
  - {id: mku-14-02-03, chapter: 14, chapter_title: 敦煌文献概述, section: 二、敦煌石室的发现及文献流散, subsection: 敦煌遗书的流散, module: M8, page_start: 375, page_end: 379, status: pending_review, key_question: 敦煌遗书怎样在十余年间流散到国内外？, summary: 从地方官员分取、清点封存未果，到斯坦因、伯希和、日本大谷队、奥登堡等取得文献，再到1910年劫余卷运京途中被盗分拆，原书逐年追踪遗书分藏中、英、法、俄、日等处的过程。, boundary: 原书明确使用“劫取”“骗购”“掠去”等责任判断；跨馆目录、数字重聚和当代开放利用属于后续研究任务，不是本节对流散的抵消性评价。, concept_ids: [c_dunhuang_dispersal, c_collection_provenance, c_digital_reunification], quiz_ids: [q-ch14-004, q-ch14-006], lab_ids: [lab-14-case-001]}
  - {id: mku-14-03-01, chapter: 14, chapter_title: 敦煌文献概述, section: 三、敦煌文献的目录, module: M4, page_start: 379, page_end: 388, status: pending_review, key_question: 十五种敦煌目录在收录范围和著录体例上有何差别？, summary: 中国、英国、法国、俄国、日本等机构目录或按馆藏流水号、或分类与专科编排，著录题名、起止、尺寸纸数、残损、题记、提要、物质形态和研究文献；总目索引再汇合部分馆藏并提供检索。, boundary: 各目录覆盖范围、编号和详略不同，旧目录还可能有题名错误、重复与遗漏；所谓“总目”也未必囊括所有散藏材料。, concept_ids: [c_dunhuang_catalog, me_dunhuang_id_resolution, c_bibliographic_entry], quiz_ids: [q-ch14-001, q-ch14-005], lab_ids: [lab-14-case-001]}
  - {id: mku-14-04-01, chapter: 14, chapter_title: 敦煌文献概述, section: 四、敦煌文献的汇编整理与刊行, module: M8, page_start: 388, page_end: 396, status: pending_review, key_question: 综合影印、专题释录和校注本分别怎样组织敦煌材料？, summary: 原书列举《敦煌宝藏》《敦煌吐鲁番文献集成》等综合影印，又介绍佛经、地理、社会经济、法制、医药、韵书、古籍和俗文学等专题汇编；各书在图像、录文、题解、校记、考释与索引上各有取舍。, boundary: 原书比较的是具体书目体例，并未讨论数字平台；“影像、释录与实物不能相互替代”是网站据这些体例补充的方法提醒。, concept_ids: [c_dunhuang_edition, c_dunhuang_catalog, me_photographic_reproduction], quiz_ids: [q-ch14-002, q-ch14-007], lab_ids: [lab-14-case-001]}
  - {id: mku-14-04-02, chapter: 14, chapter_title: 敦煌文献概述, section: 四、敦煌文献的汇编整理与刊行, subsection: 网站延伸：残卷缀合, module: M8, page_start: 388, page_end: 396, status: drafting, key_question: 网站怎样把原书零散提及的“缀合”改造成证据训练？, summary: 原书仅在具体整理本中提及若干经卷缀合，未在本节建立通用流程；网站据敦煌写卷特点另设纸张、尺寸、断口、书手、行款、内容和收藏史的多证据练习。, boundary: 本单元是数字人文教学建模，不是原书独立小节；具体同卷判断必须回查原件、高清图像与专门研究，内容相近本身不足为证。, concept_ids: [c_fragment_reunification, c_dunhuang_dispersal, c_evidence_chain], quiz_ids: [q-ch14-003, q-ch14-005], lab_ids: [lab-14-case-001]}
  - {id: mku-14-05-01, chapter: 14, chapter_title: 敦煌文献概述, section: 五、敦煌文献的内容及价值, subsection: 宗教文献与儒家经籍, module: M8, page_start: 396, page_end: 400, status: pending_review, key_question: 宗教遗书和儒家经籍写本分别提供什么新材料？, summary: 佛教文献约占敦煌遗书九成，并保存逸经及三阶教、禅宗北宗资料；道教、摩尼教、景教文献可补宗教史。儒家经籍唐写本则用于校补传本、比较异文并辑复郑玄注等亡佚旧注。, boundary: “佛教文献约占九成”只说明藏经洞遗书构成，不能直接推成中古社会全部文献生产比例；后一句是网站的范围提醒。, concept_ids: [c_dunhuang_religion, c_dunhuang_secular, me_hand_copying], quiz_ids: [q-ch14-004, q-ch14-008], lab_ids: [lab-14-case-001]}
  - {id: mku-14-05-02, chapter: 14, chapter_title: 敦煌文献概述, section: 五、敦煌文献的内容及价值, subsection: 语言、史地、子书与文学, module: M8, page_start: 400, page_end: 410, status: pending_review, key_question: 敦煌材料怎样扩展语言、史地、子书与文学研究？, summary: 韵书音注、俗文学用韵、字书俗字和俗语词保存唐五代语言；史籍残卷、寺院及官私文书、地志可校史补史；子部写本可补脱存佚；文人作品和变文、讲经文、词文等又支持校勘、辑佚与俗文学史研究。, boundary: 原书分别讨论正统与通俗语言、传世与亡佚古籍、文人创作与俗文学，不能用“日常生活材料”一词抹平这些文献类型。, concept_ids: [c_dunhuang_secular, c_local_source_bias, c_collection_documentary_value], quiz_ids: [q-ch14-005, q-ch14-006], lab_ids: [lab-14-case-001]}
  - {id: mku-14-05-03, chapter: 14, chapter_title: 敦煌文献概述, section: 五、敦煌文献的内容及价值, subsection: 考古艺术与科技史料, module: M8, page_start: 405, page_end: 414, status: pending_review, key_question: 敦煌保存了哪些考古艺术与科技史实物？, summary: 石窟建筑、壁画彩塑、绢纸画、书法、曲谱舞谱构成考古艺术材料；医书、星图、历日、算书以及纪年纸样、早期印本和多种装订实物又保存医学、天文历法、数学、造纸印刷与书籍装订史证据。, boundary: 原书此节同时使用洞窟、图像、写卷和印本等不同证据；网站要求在跨学科解释时分别标明材料来源，不能只以“敦煌文献”笼统代称。, concept_ids: [c_dunhuang_secular, c_mogao_caves, c_archaeological_context], quiz_ids: [q-ch14-007, q-ch14-008], lab_ids: [lab-14-case-001]}
  - {id: mku-14-06-01, chapter: 14, chapter_title: 敦煌文献概述, section: 修订本后记, module: M1, page_start: 414, status: pending_review, key_question: 后记怎样记录修订本相对初版的变化？, summary: 后记说明2001年至2006年的印次、2007年修订经过，并按十一项列出各章增订删改；作者又明确说明追求准确性和前沿性时受到时间与学养限制。, boundary: 后记是全书版本史料，不属于第十四章正文，更不是虚构的第十五章；网站把它作为独立学习单元属于编辑设计。, concept_ids: [c_revision_history, c_version, c_research_boundary], quiz_ids: [q-ch14-007, q-ch14-008], lab_ids: [lab-14-case-001]}
