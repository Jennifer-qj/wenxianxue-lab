items:
  - {id: mku-14-01-01, chapter: 14, chapter_title: 敦煌文献概述, section: 一、敦煌、敦煌石窟、莫高窟与藏经洞, module: M8, page_start: 368, page_end: 371, status: pending_review, key_question: 四个地理与遗址概念怎样避免混用？, summary: 敦煌是区域城市，敦煌石窟是区域石窟群，莫高窟是核心遗址之一，藏经洞则是莫高窟中的特定洞窟空间。, boundary: 地名、遗址群、单一石窟与洞内文献不是同一层级。, concept_ids: [c_dunhuang, c_mogao_caves, c_library_cave], quiz_ids: [q-ch14-001, q-ch14-006], lab_ids: [lab-14-case-001]}
  - {id: mku-14-02-01, chapter: 14, chapter_title: 敦煌文献概述, section: 二、敦煌石室的发现及文献流散, subsection: 藏经洞的发现, module: M8, page_start: 371, page_end: 372, status: pending_review, key_question: 发现史怎样影响早期文献记录？, summary: 藏经洞被重新发现后经历查看、移动和交易，早期记录不完整影响对原始排列和数量的认识。, boundary: 后来回忆和流行叙事应与当时记录、实物编号及收藏档案区分。, concept_ids: [ev_library_cave_discovery, c_library_cave, c_archaeological_context], quiz_ids: [q-ch14-002, q-ch14-007], lab_ids: [lab-14-case-001]}
  - {id: mku-14-02-02, chapter: 14, chapter_title: 敦煌文献概述, section: 二、敦煌石室的发现及文献流散, subsection: 封闭时间与原因, module: M8, page_start: 372, page_end: 375, status: pending_review, key_question: 怎样表达藏经洞封闭原因的不同假说？, summary: 可从文献年代、洞窟环境和历史事件提出避难、废弃经卷集中等解释，但证据尚需分别评估。, boundary: 最晚纪年提供时间线索而非自动锁定封闭年份和唯一原因。, concept_ids: [c_library_cave, c_authentication_conclusion, c_suspensive_judgment], quiz_ids: [q-ch14-003, q-ch14-008], lab_ids: [lab-14-case-001]}
  - {id: mku-14-02-03, chapter: 14, chapter_title: 敦煌文献概述, section: 二、敦煌石室的发现及文献流散, subsection: 敦煌遗书的流散, module: M8, page_start: 375, page_end: 379, status: pending_review, key_question: 文献流散为何同时造成损失与新的研究任务？, summary: 遗书分藏国内外多家机构造成原始组合破坏与检索困难，也促成跨馆目录、影像和缀合研究。, boundary: 讨论收藏史需区分历史事实、责任判断和当前开放利用条件。, concept_ids: [c_dunhuang_dispersal, c_collection_provenance, c_digital_reunification], quiz_ids: [q-ch14-004, q-ch14-006], lab_ids: [lab-14-case-001]}
  - {id: mku-14-03-01, chapter: 14, chapter_title: 敦煌文献概述, section: 三、敦煌文献的目录, module: M4, page_start: 379, page_end: 388, status: pending_review, key_question: 怎样从不同国家和机构编号定位同一写卷？, summary: 馆藏目录和编号体系记录来源、尺寸、内容、首尾及旧号，新旧目录对照是跨馆定位与去重基础。, boundary: 同一写卷可能有多种旧新编号，题名也可能由整理者拟定。, concept_ids: [c_dunhuang_catalog, me_dunhuang_id_resolution, c_bibliographic_entry], quiz_ids: [q-ch14-001, q-ch14-005], lab_ids: [lab-14-case-001]}
  - {id: mku-14-04-01, chapter: 14, chapter_title: 敦煌文献概述, section: 四、敦煌文献的汇编整理与刊行, module: M8, page_start: 388, page_end: 396, status: pending_review, key_question: 影印、释录和校订各保留什么信息？, summary: 影像展示可见形态，释录便于阅读检索，校订处理文字问题；联合目录和数字平台可虚拟重聚分散材料。, boundary: 释录不能替代图像，数字图像也不能完整替代实物材质和装帧。, concept_ids: [c_dunhuang_edition, c_digital_reunification, me_photographic_reproduction], quiz_ids: [q-ch14-002, q-ch14-007], lab_ids: [lab-14-case-001]}
  - {id: mku-14-04-02, chapter: 14, chapter_title: 敦煌文献概述, section: 四、敦煌文献的汇编整理与刊行, subsection: 残卷缀合, module: M8, page_start: 388, page_end: 396, status: drafting, key_question: 分藏两地的残片怎样证明原属一卷？, summary: 纸张、尺寸、断口、书手、行款、内容承接和收藏史可共同支持残卷缀合，并应保存图像比对记录。, boundary: 内容相近不足以证明物理同卷，必须形成多项独立证据。, concept_ids: [c_fragment_reunification, c_dunhuang_dispersal, c_evidence_chain], quiz_ids: [q-ch14-003, q-ch14-005], lab_ids: [lab-14-case-001]}
  - {id: mku-14-05-01, chapter: 14, chapter_title: 敦煌文献概述, section: 五、敦煌文献的内容及价值, subsection: 宗教文献与儒家经籍, module: M8, page_start: 396, page_end: 400, status: pending_review, key_question: 敦煌写本怎样呈现宗教实践与经典传播？, summary: 佛道等宗教文献数量丰富，并与儒家经籍写本共同保存中古抄写、讲诵、注释和信仰实践。, boundary: 藏经洞材料比例不等于整个社会文献生产比例，其聚藏机制具有选择性。, concept_ids: [c_dunhuang_religion, c_dunhuang_secular, me_hand_copying], quiz_ids: [q-ch14-004, q-ch14-008], lab_ids: [lab-14-case-001]}
  - {id: mku-14-05-02, chapter: 14, chapter_title: 敦煌文献概述, section: 五、敦煌文献的内容及价值, subsection: 语言、史地、子书与文学, module: M8, page_start: 400, page_end: 410, status: pending_review, key_question: 非正统和日常文本为何格外珍贵？, summary: 俗语词、契约文书、地方记录、蒙书、变文诗歌等保存传世典籍较少记录的语言生活和地域文化。, boundary: 文书格式与文学程式会塑造内容，不能简单视为未经加工的生活实录。, concept_ids: [c_dunhuang_secular, c_local_source_bias, c_collection_documentary_value], quiz_ids: [q-ch14-005, q-ch14-006], lab_ids: [lab-14-case-001]}
  - {id: mku-14-05-03, chapter: 14, chapter_title: 敦煌文献概述, section: 五、敦煌文献的内容及价值, subsection: 考古艺术与科技史料, module: M8, page_start: 405, page_end: 414, status: pending_review, key_question: 怎样联合文字、图像和物质信息研究敦煌？, summary: 洞窟形制、绘画图样、历法医药和技术文书需要文字释读、艺术史、考古与科技史方法协作。, boundary: 跨学科解释必须说明各类证据的来源和专业限制。, concept_ids: [c_dunhuang_secular, c_mogao_caves, c_archaeological_context], quiz_ids: [q-ch14-007, q-ch14-008], lab_ids: [lab-14-case-001]}
  - {id: mku-14-06-01, chapter: 14, chapter_title: 敦煌文献概述, section: 附录、修订本后记, module: M1, page_start: 414, status: pending_review, key_question: 修订说明为什么也是理解教材版本的重要材料？, summary: 后记交代各章增订重点、资料更新和作者自述的研究局限，可用于追踪本书从初版到修订本的变化。, boundary: 后记属于全书元数据而非第十五章，不能据此虚构原书章节。, concept_ids: [c_revision_history, c_version, c_research_boundary], quiz_ids: [q-ch14-007, q-ch14-008], lab_ids: [lab-14-case-001]}
