items:
  - {id: mku-03-01-01, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （一）著, module: M3, page_start: 30, page_end: 32, status: pending_review, key_question: “著”为什么不等于文本从未借鉴前人？, summary: 著强调作者相对独立的创造和组织，但仍处在已有知识与文献传统中。, boundary: 作者署名不能自动证明现存文本全部出自其本人。, concept_ids: [c_authorship_zhu, c_textual_agent], quiz_ids: [q-ch03-001, q-ch03-009], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-02, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （二）述, module: M3, page_start: 32, page_end: 33, status: pending_review, key_question: “述”怎样处理既有知识？, summary: 述以传承、记录和解释既有言论或学说为主要特征。, boundary: 传述也包含选择与表达，不能视为完全透明的复制。, concept_ids: [c_authorship_shu, c_textual_agent], quiz_ids: [q-ch03-002, q-ch03-007], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-03, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （三）编, module: M3, page_start: 33, page_end: 34, status: pending_review, key_question: 编纂如何改变材料意义？, summary: 编者通过选取、删节、分类和排序重构既有材料，使其进入新的知识框架。, boundary: 汇集旧材料不等于保存原貌，应追踪来源和编选规则。, concept_ids: [c_compilation, c_textual_agent, c_evidence_chain], quiz_ids: [q-ch03-003, q-ch03-008], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-04, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （四）译：佛典翻译, module: M3, page_start: 34, page_end: 41, status: pending_review, key_question: 佛典汉译为什么常是协作形成过程？, summary: 译经可能涉及口授、笔受、证义、润文等多种角色，术语和文本经多人协作形成。, boundary: 题名译者不一定等于全部文字的唯一责任者。, concept_ids: [c_translation, c_buddhist_translation, c_textual_agent], quiz_ids: [q-ch03-004, q-ch03-010], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-05, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （四）译：学术翻译, module: M3, page_start: 41, page_end: 46, status: pending_review, key_question: 学术翻译如何引入新的知识结构？, summary: 学术概念和术语在转译中需要与目标语言知识体系协调，译文也是知识再组织。, boundary: 术语差异可能来自时代和知识背景，不能一概视为误译。, concept_ids: [c_translation, c_scholarly_translation], quiz_ids: [q-ch03-005, q-ch03-011], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-06, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （四）译：文学翻译, module: M3, page_start: 46, page_end: 47, status: pending_review, key_question: 文学翻译为什么不能只逐字对应？, summary: 文学翻译同时处理意义、语体、节奏与文化语境，形成新的目标语文本。, boundary: 译文的创造性不取消对原作关系和翻译策略的说明责任。, concept_ids: [c_translation, c_literary_translation], quiz_ids: [q-ch03-006, q-ch03-012], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-01, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （一）讲唱, module: M3, page_start: 47, page_end: 52, status: pending_review, key_question: 口头流传怎样生成文本差异？, summary: 讲唱面向不同听众反复演述，记忆、表演和场景变化会产生异文和不同篇幅。, boundary: 口传差异不必然是错误，也可能体现活态传统。, concept_ids: [me_oral_transmission, c_transmission_error], quiz_ids: [q-ch03-002, q-ch03-008], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-02, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （二）镌刻, module: M3, page_start: 52, status: pending_review, key_question: 镌刻如何同时追求耐久与公开？, summary: 文字刻于金石等材料，可长期保存并面向特定空间中的读者。, boundary: 耐久不等于文本绝对可靠，刻写和拓印仍会产生差异。, concept_ids: [me_inscription, c_transmission_error], quiz_ids: [q-ch03-003, q-ch03-009], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-03, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （三）抄写, module: M3, page_start: 52, page_end: 53, status: pending_review, key_question: 抄写为什么会产生系统性差异？, summary: 手工复制受底本、抄手、视线和语言习惯影响，可出现讹、脱、衍、倒等变化。, boundary: 写本不必然劣于印本，可靠性取决于具体传承关系。, concept_ids: [me_hand_copying, c_transmission_error], quiz_ids: [q-ch03-004, q-ch03-010], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-04, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （四）印刷, module: M3, page_start: 53, page_end: 55, status: pending_review, key_question: 印刷扩大传播后为何仍有版本问题？, summary: 印刷提高复制规模并可固定某种文本，同时也会固定底本错误或因修版补版产生差异。, boundary: 印刷并不自动消灭误差，也不能据此断言所有印本一致。, concept_ids: [me_printing, c_transmission_error, c_textual_lifecycle], quiz_ids: [q-ch03-005, q-ch03-011], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-05, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （五）摄影, module: M3, page_start: 55, status: pending_review, key_question: 摄影复制保留和丢失了什么？, summary: 摄影能较准确保存可见外观并扩大稀见文献利用范围，但无法完整替代尺寸、触感、装订和材质观察。, boundary: 影像清晰不等于对象完整，也需记录拍摄、裁切和色彩条件。, concept_ids: [me_photographic_reproduction, c_research_boundary], quiz_ids: [q-ch03-006, q-ch03-012], lab_ids: [lab-09-case-001]}

