items:
  - {id: mku-03-01-01, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （一）著, module: M3, page_start: 30, page_end: 32, status: pending_review, key_question: “著”为什么不等于文本从未借鉴前人？, summary: 著强调作者相对独立的创造和组织，但仍处在已有知识与文献传统中。, boundary: 作者署名不能自动证明现存文本全部出自其本人。, concept_ids: [c_authorship_zhu, c_textual_agent], quiz_ids: [q-ch03-001, q-ch03-009], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-02, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （二）述, module: M3, page_start: 32, page_end: 33, status: pending_review, key_question: “述”怎样处理既有知识？, summary: 述以传承、记录和解释既有言论或学说为主要特征。, boundary: 传述也包含选择与表达，不能视为完全透明的复制。, concept_ids: [c_authorship_shu, c_textual_agent], quiz_ids: [q-ch03-002, q-ch03-007], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-03, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （三）编, module: M3, page_start: 33, page_end: 34, status: pending_review, key_question: “编”的核心规则和价值是什么？, summary: 编纂依一定体例缀辑旧文，原始条文原则上不加改窜，通常注明出处；总集、类书、丛书、档案类编和辑佚都可由此保存并组织材料。, boundary: 编纂成果有高下之别；是否注明出处、材料是否保持原文和体例是否清楚，需要逐书判断。, concept_ids: [c_compilation, c_textual_agent, c_evidence_chain], quiz_ids: [q-ch03-003, q-ch03-008], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-04, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （四）译：佛典翻译, module: M3, page_start: 34, page_end: 41, status: pending_review, key_question: 为什么佛典汉译不能只看题名中的一位译者？, summary: 佛典汉译经历译师口译、助手参与、译场组织、旧译对勘和文体调整等不同方式，文本往往在多人协作与反复处理之中形成。, boundary: 不同译场的分工并不完全相同；题名译者不一定等于全部文字的唯一责任者。, concept_ids: [c_translation, c_buddhist_translation, c_textual_agent], quiz_ids: [q-ch03-004, q-ch03-010], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-05, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （四）译：学术翻译, module: M3, page_start: 41, page_end: 46, status: pending_review, key_question: 学术翻译怎样依靠协作与出版机构扩大影响？, summary: 明末清初和晚清的学术翻译常由中外人士合作完成，江南制造局翻译馆等机构把口译、笔述、校对、制图、刻印和发行连接起来，严复又提出“信、达、雅”的翻译标准。, boundary: 同一译书中的口译、笔述、校对和出版责任应分别辨认，不能笼统归给一人。, concept_ids: [c_translation, c_scholarly_translation], quiz_ids: [q-ch03-005, q-ch03-011], lab_ids: [lab-09-case-001]}
  - {id: mku-03-01-06, chapter: 3, chapter_title: 文献的形成与流布, section: 一、文献的形成, subsection: （四）译：文学翻译, module: M3, page_start: 46, page_end: 47, status: pending_review, key_question: 林纾的翻译怎样体现协作和再表达？, summary: 林纾不懂外文，由他人口译、自己用文言笔述，并对原作有所增删润饰；其译文的情调与影响也受到同时代读者和作家的讨论。, boundary: 评价林译既要说明转述链条和改写事实，也不能只因译者不懂外文便抹去其文学影响。, concept_ids: [c_translation, c_literary_translation], quiz_ids: [q-ch03-006, q-ch03-012], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-01, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （一）讲唱, module: M3, page_start: 47, page_end: 52, status: pending_review, key_question: 口头流传怎样生成文本差异？, summary: 讲唱面向不同听众反复演述，记忆、表演和场景变化会产生异文和不同篇幅。, boundary: 口传差异不必然是错误，也可能体现活态传统。, concept_ids: [me_oral_transmission, c_transmission_error], quiz_ids: [q-ch03-002, q-ch03-008], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-02, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （二）镌刻, module: M3, page_start: 52, status: pending_review, key_question: 本章所说的“镌刻”包括哪些载体？, summary: 镌刻是把文献文字刻在载体上，甲骨、金属和石头都可用于镌刻；其载体特点与前章相互衔接。, boundary: 本节只作流布方式的简要界定，未展开耐久性、公开性或拓印差异，相关判断不能冒充原书本节结论。, concept_ids: [me_inscription, c_transmission_error], quiz_ids: [q-ch03-003, q-ch03-009], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-03, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （三）抄写, module: M3, page_start: 52, page_end: 53, status: pending_review, key_question: 印刷普及以后，抄写为什么仍是重要的流布方式？, summary: 印刷术发明以后，许多作品先以抄本流传，大型类书和丛书也可能依靠抄写完成；不少文献只有抄本传世。, boundary: 本节重点是抄写长期存在的事实，并未在此系统讲解讹、脱、衍、倒的成因。, concept_ids: [me_hand_copying, c_transmission_error], quiz_ids: [q-ch03-004, q-ch03-010], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-04, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （四）印刷, module: M3, page_start: 53, page_end: 55, status: pending_review, key_question: 判断中国印刷术发明年代应怎样衡量证据？, summary: 原书比较多种起源说、文献记载和早期印刷实物，认为东汉至隋代诸说依据不足，初唐至盛唐说相对可信，并区分捺印佛像与整版印刷。, boundary: “相对可信”不是无争议定论；传世记载、后世伪书、实物年代与技术起点应分层评价。, concept_ids: [me_printing, c_transmission_error, c_textual_lifecycle], quiz_ids: [q-ch03-005, q-ch03-011], lab_ids: [lab-09-case-001]}
  - {id: mku-03-02-05, chapter: 3, chapter_title: 文献的形成与流布, section: 二、文献的流布, subsection: （五）摄影, module: M3, page_start: 55, status: pending_review, key_question: 缩微摄影在保护和阅读文献时有什么得失？, summary: 缩微胶卷便于保护原件、复制和阅读，也可还原到纸上；但色盲胶卷在滤去底灰时，可能连颜色较淡的印记和批点一并滤掉。, boundary: 本节讨论的是当时的缩微胶卷条件，不能把它无差别套用于所有现代数字影像技术。, concept_ids: [me_photographic_reproduction, c_research_boundary], quiz_ids: [q-ch03-006, q-ch03-012], lab_ids: [lab-09-case-001]}

