items:
  - {id: mku-09-01-01, chapter: 9, chapter_title: 类书与丛书, section: 一、类书, subsection: 类书的定义与起源, module: M4, page_start: 220, page_end: 222, status: pending_review, key_question: 类书与普通著作的组织方式有何不同？, summary: 类书从群书摘取材料，按事类或韵目重新排列，以快速提供相关语料和知识片段。, boundary: 类书条目脱离原书语境，不能不回查出处就当作完整原文。, concept_ids: [c_leishu, c_collection_series_boundary], quiz_ids: [q-ch09-001, q-ch09-006], lab_ids: [lab-09-case-002]}
  - {id: mku-09-01-02, chapter: 9, chapter_title: 类书与丛书, section: 一、类书, subsection: 查找史料与辞藻, module: M4, page_start: 222, page_end: 225, status: pending_review, key_question: 类书如何把问题转化为可检索的类目？, summary: 研究者可由人物、制度、物类、典故或韵目进入条目，发现分散在群书中的材料和表达。, boundary: 检索命中只是线索，不等于材料已核实或语义完整。, concept_ids: [c_leishu_function, me_leishu_retrieval], quiz_ids: [q-ch09-002, q-ch09-007], lab_ids: [lab-09-case-002]}
  - {id: mku-09-01-03, chapter: 9, chapter_title: 类书与丛书, section: 一、类书, subsection: 校勘考订与辑佚, module: M7, page_start: 225, page_end: 226, status: pending_review, key_question: 类书征引为何能保存失传异文？, summary: 早期类书可能保留后世传本未见的引文，可用于他校与辑佚，但须辨别节引和类书自身讹误。, boundary: 类书引文的早出并不自动保证逐字可靠。, concept_ids: [c_leishu_function, c_leishu_citation_risk, c_reconstruction, me_tajiao], quiz_ids: [q-ch09-003, q-ch09-008], lab_ids: [lab-09-case-002]}
  - {id: mku-09-01-04, chapter: 9, chapter_title: 类书与丛书, section: 一、类书, subsection: 唐宋代表类书, module: M4, page_start: 226, page_end: 232, status: pending_review, key_question: 不同类书的体例如何决定检索路径？, summary: 北堂书钞、艺文类聚、初学记、太平广记、太平御览和册府元龟等在类目、材料性质与编纂目的上各有侧重。, boundary: 记住书名不能替代阅读凡例和掌握索引体系。, concept_ids: [c_leishu, me_leishu_retrieval], quiz_ids: [q-ch09-004, q-ch09-006], lab_ids: [lab-09-case-002]}
  - {id: mku-09-01-05, chapter: 9, chapter_title: 类书与丛书, section: 一、类书, subsection: 明清代表类书, module: M4, page_start: 232, page_end: 240, status: pending_review, key_question: 大型类书怎样成为亡佚文献的资料库？, summary: 永乐大典、古今图书集成、佩文韵府和骈字类编等以不同规模与体例汇聚材料，其中部分保存了珍贵佚文。, boundary: 大规模不等于无遗漏，材料仍受编纂取舍和存佚状况限制。, concept_ids: [c_leishu, w_yongle_dadian, c_leishu_citation_risk], quiz_ids: [q-ch09-005, q-ch09-008], lab_ids: [lab-09-case-002]}
  - {id: mku-09-02-01, chapter: 9, chapter_title: 类书与丛书, section: 二、丛书, subsection: 丛书的定义, module: M4, page_start: 240, status: pending_review, key_question: 丛书与类书最关键的结构差异是什么？, summary: 丛书汇集多种相对独立的书，类书则抽取各书内容重组为条目，两者的信息边界不同。, boundary: 某些大型汇编名称复杂，应根据内部是否保留单书独立性判断。, concept_ids: [c_congshu, c_collection_series_boundary], quiz_ids: [q-ch09-001, q-ch09-005], lab_ids: [lab-09-case-002]}
  - {id: mku-09-02-02, chapter: 9, chapter_title: 类书与丛书, section: 二、丛书, subsection: 丛书的起源与功用, module: M4, page_start: 240, page_end: 242, status: pending_review, key_question: 丛书怎样改变稀见著作的存续机会？, summary: 集中刊印降低获取成本并保存散佚风险较高的小书，也通过选书标准形成特定知识面貌。, boundary: 收入丛书可能伴随删改、重排和据本差异，使用时须说明丛书版本。, concept_ids: [c_congshu_function, c_congshu_edition], quiz_ids: [q-ch09-002, q-ch09-007], lab_ids: [lab-09-case-002]}
  - {id: mku-09-02-03, chapter: 9, chapter_title: 类书与丛书, section: 二、丛书, subsection: 丛书举要, module: M4, page_start: 242, page_end: 266, status: pending_review, key_question: 选择丛书本时应查哪些版本信息？, summary: 综合性、地方性、专门性和续编丛书数量众多，应核查编者、刊刻年代、底本、收书范围、版本及后续影印情况。, boundary: 同名丛书或重印本可能沿袭目录却替换底本，不能只据封面识别。, concept_ids: [c_congshu, c_congshu_edition, w_siku_quanshu], quiz_ids: [q-ch09-003, q-ch09-004], lab_ids: [lab-09-case-002]}
