items:
  - {id: mku-02-01-01, chapter: 2, chapter_title: 文献的载体, section: 一、甲骨, module: M2, page_start: 11, page_end: 12, status: pending_review, key_question: 甲骨如何成为可研究的文字载体？, summary: 龟甲兽骨既保存刻写内容，也保留占卜、整治和出土环境等物质信息。, boundary: 甲骨不等于全部商代记录，研究须结合实物与出土语境。, concept_ids: [m_oracle_bone, c_carrier_constraint], quiz_ids: [q-ch02-001, q-ch02-008], lab_ids: [lab-03-case-001]}
  - {id: mku-02-02-01, chapter: 2, chapter_title: 文献的载体, section: 二、金, module: M2, page_start: 12, page_end: 14, status: pending_review, key_question: 青铜器类别为何影响铭文解释？, summary: 礼器、乐器、兵器、度量衡、钱币和符玺等器类具有不同功能，铭文必须联系器物使用场景理解。, boundary: 器类与铭文功能并非一一对应，仍须核对形制和时代。, concept_ids: [m_bronze, c_carrier_constraint], quiz_ids: [q-ch02-002, q-ch02-007], lab_ids: [lab-03-case-001]}
  - {id: mku-02-03-01, chapter: 2, chapter_title: 文献的载体, section: 三、石, module: M2, page_start: 14, page_end: 16, status: pending_review, key_question: 石刻为什么不能被视为单一形态？, summary: 碣、摩崖和碑在加工方式、空间位置与使用功能上存在差异。, boundary: 名称在历代使用中可能变化，不能只凭现代字面机械归类。, concept_ids: [m_stone, c_jie, c_cliff_inscription, c_stele], quiz_ids: [q-ch02-003, q-ch02-006], lab_ids: [lab-03-case-001]}
  - {id: mku-02-04-01, chapter: 2, chapter_title: 文献的载体, section: 四、竹木, module: M2, page_start: 16, page_end: 20, status: pending_review, key_question: 简牍形制怎样影响文本次序与术语？, summary: 竹木被加工成不同尺寸的简牍，以绳编联；编绳断裂会造成次序问题，册、篇、卷等术语也保留形制痕迹。, boundary: 出土简牍尺寸和编联方式存在变通，文献记载不能替代实物观察。, concept_ids: [m_bamboo_wood, c_slip_binding, c_sealing_clay, c_carrier_constraint], quiz_ids: [q-ch02-004, q-ch02-009, q-ch02-011], lab_ids: [lab-03-case-001]}
  - {id: mku-02-05-01, chapter: 2, chapter_title: 文献的载体, section: 五、帛, module: M2, page_start: 20, page_end: 21, status: pending_review, key_question: 帛的材料性质带来了哪些记录优势？, summary: 帛轻便且适合书写与绘图，与简策长期并用，并在早期图书形态中承担重要角色。, boundary: 帛价格和保存条件限制其普及，不能据此推断所有重要文本都曾写在帛上。, concept_ids: [m_silk, c_carrier_constraint], quiz_ids: [q-ch02-005, q-ch02-010], lab_ids: [lab-03-case-001]}
  - {id: mku-02-06-01, chapter: 2, chapter_title: 文献的载体, section: 六、莎草纸, module: M2, page_start: 21, page_end: 22, status: pending_review, key_question: 莎草纸怎样形成卷本传统？, summary: 莎草茎片经排列、黏合和压平形成书写面，多页可连接成长卷，在地中海世界长期使用。, boundary: 名称含“纸”不等于中国植物纤维纸，制作原理需要区分。, concept_ids: [m_papyrus, c_scroll_binding], quiz_ids: [q-ch02-005, q-ch02-007], lab_ids: [lab-03-case-001]}
  - {id: mku-02-07-01, chapter: 2, chapter_title: 文献的载体, section: 七、羊皮纸, module: M2, page_start: 22, page_end: 23, status: pending_review, key_question: 羊皮纸为何适合形成册页书？, summary: 兽皮经加工成为坚韧平展的书写面，在欧洲长期用于宗教和法律文书。, boundary: 载体普及年代具有区域差异，不能用单一时间线概括世界各地。, concept_ids: [m_parchment, c_carrier_constraint], quiz_ids: [q-ch02-006, q-ch02-010], lab_ids: [lab-03-case-001]}
  - {id: mku-02-08-01, chapter: 2, chapter_title: 文献的载体, section: 八、贝叶, module: M2, page_start: 23, page_end: 24, status: pending_review, key_question: 贝叶怎样决定梵夹式装订？, summary: 长条叶片刺写后叠放、穿孔并以夹板和绳固定，形成适应该材料的阅读与收存方式。, boundary: 中国纸本对梵夹形态的模仿应与真实贝叶材料区分。, concept_ids: [m_palm_leaf, c_carrier_constraint], quiz_ids: [q-ch02-003, q-ch02-008], lab_ids: [lab-03-case-001]}
  - {id: mku-02-09-01, chapter: 2, chapter_title: 文献的载体, section: 九、纸, subsection: （一）造纸术的发明, module: M2, page_start: 24, page_end: 25, status: pending_review, key_question: 如何理解纸的发明与推广？, summary: 纸的出现和改进是逐步发展的过程，考古实物与传世记载需要结合，纸也经历了与简帛并用的阶段。, boundary: 不能把改进者简单等同于唯一发明者，也不能把发现实物的年代直接当作技术起点。, concept_ids: [m_paper, ev_paper_invention, c_evidence_chain], quiz_ids: [q-ch02-001, q-ch02-012], lab_ids: [lab-03-case-001]}
  - {id: mku-02-09-02, chapter: 2, chapter_title: 文献的载体, section: 九、纸, subsection: 1. 卷子, module: M2, page_start: 25, page_end: 27, status: pending_review, key_question: 卷子装如何组织长篇阅读？, summary: 纸叶粘连成长幅并围绕轴或直接卷收，阅读需要随展开过程推进。, boundary: 现存卷轴可能经过后配、改装或截断，当前形态不必然等于初装。, concept_ids: [m_paper, c_scroll_binding], quiz_ids: [q-ch02-002, q-ch02-006], lab_ids: [lab-04-case-001]}
  - {id: mku-02-09-03, chapter: 2, chapter_title: 文献的载体, section: 九、纸, subsection: 2. 经折装, module: M2, page_start: 27, status: pending_review, key_question: 经折装怎样改变卷子的翻阅方式？, summary: 长幅纸按页宽往返折叠，使读者可分段翻阅并较快定位。, boundary: 形制演变不是旧形态立即消失，新旧装潢可能长期并存。, concept_ids: [c_scroll_binding, c_accordion_binding], quiz_ids: [q-ch02-004, q-ch02-009], lab_ids: [lab-04-case-001]}
  - {id: mku-02-09-04, chapter: 2, chapter_title: 文献的载体, section: 九、纸, subsection: 3. 蝴蝶装, module: M2, page_start: 27, page_end: 28, status: pending_review, key_question: 怎样从折叶方向识别蝴蝶装？, summary: 书叶版心向内折叠，有字面相向，展开时形似蝶翼。, boundary: 后世改装可能改变书背和封面，应结合书叶折痕与版心判断。, concept_ids: [c_butterfly_binding, me_material_reading], quiz_ids: [q-ch02-003, q-ch02-011], lab_ids: [lab-04-case-001]}
  - {id: mku-02-09-05, chapter: 2, chapter_title: 文献的载体, section: 九、纸, subsection: 4. 包背装, module: M2, page_start: 28, page_end: 29, status: pending_review, key_question: 包背装与蝴蝶装的关键区别是什么？, summary: 包背装改变折叶组合并以纸包裹书背，改善翻阅和牢固程度。, boundary: 仅凭外部包背不能断定原始形制，须检查内部书叶结构。, concept_ids: [c_butterfly_binding, c_wrapped_back_binding, me_material_reading], quiz_ids: [q-ch02-007, q-ch02-011], lab_ids: [lab-04-case-001]}
  - {id: mku-02-09-06, chapter: 2, chapter_title: 文献的载体, section: 九、纸, subsection: 5. 线装, module: M2, page_start: 29, status: pending_review, key_question: 线装的结构特征及判断边界是什么？, summary: 书叶齐整后近书脊打孔穿线，便于装订和修补，成为后期古籍常见形制。, boundary: 线装常见不等于所有线装书都形成于同一时期，旧书也可能后改线装。, concept_ids: [c_thread_binding, me_material_reading, c_material_anachronism], quiz_ids: [q-ch02-005, q-ch02-012], lab_ids: [lab-04-case-001]}
