items:
  - {id: mku-07-01-01, chapter: 7, chapter_title: 文献目录, section: 一、“目录”的产生及其含义, module: M4, page_start: 151, page_end: 154, status: pending_review, key_question: 古代“目录”为什么兼有篇目与叙录之意？, summary: 刘向校书既排定篇目，又为每书撰成兼述整理、作者与内容评价的叙录；多书的目次与叙录汇编，构成兼具著录和学术判断的群书目录。, boundary: 现代仅列书名的清单只是简化形态，不能涵盖传统目录的提要、分类和学术源流功能。, concept_ids: [c_bibliography, c_bibliographic_abstract], quiz_ids: [q-ch07-001, q-ch07-008], lab_ids: [lab-07-case-001]}
  - {id: mku-07-02-01, chapter: 7, chapter_title: 文献目录, section: 二、古籍分类, module: M4, page_start: 154, page_end: 160, status: pending_review, key_question: 古籍分类为什么既为了找书，也能反映学术源流？, summary: 从六分、七分到经史子集四部，类目既服务“即类求书”，也借知识门类及其次序显示“类例既分，学术自明”。, boundary: 新旧分类法适应不同文献和学术结构，不能简单按先进或落后排序；分类应从对象与实际需要出发。, concept_ids: [c_bibliographic_classification, c_bibliography], quiz_ids: [q-ch07-002, q-ch07-005], lab_ids: [lab-07-case-001]}
  - {id: mku-07-03-01, chapter: 7, chapter_title: 文献目录, section: 三、目录的主要内容, subsection: 书名与篇卷, module: M4, page_start: 160, page_end: 163, status: pending_review, key_question: 书名和卷数为什么不能机械视为作品身份？, summary: 古书可按通称、篇中字词、姓名、朝代、时间、地点或内容命名，并存在同书异名、异书同名和篇卷分合。, boundary: 名称与卷数必须联系时代、传本和著录系统识别。, concept_ids: [c_bibliographic_entry, c_same_book_names], quiz_ids: [q-ch07-003, q-ch07-007], lab_ids: [lab-07-case-001]}
  - {id: mku-07-03-02, chapter: 7, chapter_title: 文献目录, section: 三、目录的主要内容, subsection: 撰人朝代与版本, module: M4, page_start: 163, page_end: 165, status: pending_review, key_question: 著录责任者和版本时应避免哪些误判？, summary: 撰人需区分原作者、注者和编者并核实朝代，版本项则说明实际所据本子及其形态。, boundary: 沿袭旧著录不等于身份已经证实，版本名称也需对应具体证据。, concept_ids: [c_bibliographic_entry, c_textual_agent, c_version], quiz_ids: [q-ch07-004, q-ch07-006], lab_ids: [lab-07-case-001]}
  - {id: mku-07-03-03, chapter: 7, chapter_title: 文献目录, section: 三、目录的主要内容, subsection: 提要与大小序, module: M4, page_start: 165, page_end: 168, status: pending_review, key_question: 提要和序怎样把书目转化为学术史？, summary: 提要说明单书内容与价值，大小序概括类别及学术源流，使目录兼具辨章学术、考镜源流的功能。, boundary: 提要包含编者判断，应与所据版本和时代立场一并阅读。, concept_ids: [c_bibliographic_abstract, c_bibliography], quiz_ids: [q-ch07-001, q-ch07-008], lab_ids: [lab-07-case-001]}
  - {id: mku-07-04-01, chapter: 7, chapter_title: 文献目录, section: 四、目录的类型, subsection: 公藏、私藏与史志目录, module: M4, page_start: 168, page_end: 173, status: pending_review, key_question: 公藏、私藏和史志目录各能证明什么？, summary: 公藏目录呈现机构所藏，私藏目录常保存善本鉴定与题跋成果；史志目录或追记一代藏书，或限收一朝著述，还可比较著录变化以考察亡佚。, boundary: 未著录不等于当时不存在；还须辨明目录是据实物编成还是承用前目、收录古今还是限于一朝。, concept_ids: [c_public_catalog, c_private_catalog, c_dynastic_bibliography], quiz_ids: [q-ch07-002, q-ch07-004], lab_ids: [lab-07-case-001]}
  - {id: mku-07-04-02, chapter: 7, chapter_title: 文献目录, section: 四、目录的类型, subsection: 专科目录, module: M4, page_start: 173, page_end: 174, status: pending_review, key_question: 专科目录为什么适合追踪细分学科文献？, summary: 经学、小学、史部、子部和集部等专科目录可在较窄领域提供更细的分类、版本和研究线索。, boundary: 专科目录的完整性受编者见闻、地域和时代限制。, concept_ids: [c_subject_catalog, c_bibliographic_classification], quiz_ids: [q-ch07-005, q-ch07-006], lab_ids: [lab-07-case-001]}
  - {id: mku-07-04-03, chapter: 7, chapter_title: 文献目录, section: 四、目录的类型, subsection: 特种目录, module: M4, page_start: 174, page_end: 175, status: pending_review, key_question: 怎样根据研究任务选择特种目录？, summary: 举要、丛书、知见、经眼、禁毁、版本图录和辨伪目录各自服务选书、查丛书、访本、核验亲见、研究禁毁、识别形态或考辨真伪；知见包含间接获知，经眼则限于亲见。, boundary: 目录名称相近也可能证据范围不同，使用前必须查明凡例、收录标准和“所知”是否等于“所见”。, concept_ids: [c_special_catalog, c_bibliography], quiz_ids: [q-ch07-003, q-ch07-007], lab_ids: [lab-07-case-001]}
