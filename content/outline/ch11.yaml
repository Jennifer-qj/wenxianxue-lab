items:
  - {id: mku-11-01-01, chapter: 11, chapter_title: 总集与别集, section: 一、总集, subsection: 总集与选集, module: M8, page_start: 288, page_end: 295, status: pending_review, key_question: 选集怎样通过取舍塑造文学史面貌？, summary: 选集从多位作者作品中择录，编者的时代、文体和价值标准决定可见作品及排列关系。, boundary: 未被选入不等于作品当时不存在或价值较低。, concept_ids: [c_zongji, c_xuanji, c_collection_editorial_selection], quiz_ids: [q-ch11-001, q-ch11-005], lab_ids: [lab-11-case-001]}
  - {id: mku-11-01-02, chapter: 11, chapter_title: 总集与别集, section: 一、总集, subsection: 选集举要, module: M8, page_start: 288, page_end: 295, status: pending_review, key_question: 阅读代表选集为什么要先识别编选宗旨？, summary: 不同时代选集的收录范围、文体分类和评判标准不同，凡例、序言与目录可揭示其知识结构。, boundary: 选本中的文字可能经过编者删改，引用时应核查作品别本。, concept_ids: [c_xuanji, c_collection_compilation, me_collection_source_analysis], quiz_ids: [q-ch11-002, q-ch11-006], lab_ids: [lab-11-case-001]}
  - {id: mku-11-01-03, chapter: 11, chapter_title: 总集与别集, section: 一、总集, subsection: 全集举要, module: M8, page_start: 295, page_end: 301, status: pending_review, key_question: 全集型总集为何仍不必然完整？, summary: 全集型工程力求扩大搜集范围，却仍受存佚、地域、文体界定和编者见闻限制。, boundary: 书名中的“全”是一种编纂目标，不是无遗漏的事实保证。, concept_ids: [c_quanji_collection, c_collection_compilation, c_document_loss], quiz_ids: [q-ch11-003, q-ch11-007], lab_ids: [lab-11-case-001]}
  - {id: mku-11-02-01, chapter: 11, chapter_title: 总集与别集, section: 二、别集, subsection: 别集的起源, module: M8, page_start: 301, page_end: 302, status: pending_review, key_question: 一人作品怎样逐渐形成独立别集？, summary: 随个人著述积累和文集编纂发展，作者自编、门人亲属或后世整理共同推动别集形成。, boundary: 题为某人集不表示全由本人亲自编定。, concept_ids: [c_bieji, c_author_collection_layers, c_textual_agent], quiz_ids: [q-ch11-001, q-ch11-008], lab_ids: [lab-11-case-001]}
  - {id: mku-11-02-02, chapter: 11, chapter_title: 总集与别集, section: 二、别集, subsection: 别集的内容, module: M8, page_start: 302, page_end: 306, status: pending_review, key_question: 别集为何常超出纯文学作品范围？, summary: 诗文之外，奏议、书信、序跋、墓志、传记和附录等使别集兼具文学与历史文献性质。, boundary: 后人附入的年谱、传记和补遗应与作者原作分层使用。, concept_ids: [c_bieji, c_author_collection_layers, c_collection_compilation], quiz_ids: [q-ch11-004, q-ch11-006], lab_ids: [lab-11-case-001]}
  - {id: mku-11-02-03, chapter: 11, chapter_title: 总集与别集, section: 二、别集, subsection: 别集的文献价值, module: M8, page_start: 306, page_end: 309, status: pending_review, key_question: 别集怎样补充人物与时代研究？, summary: 别集保存作者作品、交游书信和现实议论，可用于校勘辑佚、人物行事、制度社会与文学史研究。, boundary: 自述和应酬文字有特定表达目的，事实判断仍需外部材料互证。, concept_ids: [c_collection_documentary_value, me_collection_source_analysis, c_local_source_bias], quiz_ids: [q-ch11-005, q-ch11-007], lab_ids: [lab-11-case-001]}
  - {id: mku-11-03-01, chapter: 11, chapter_title: 总集与别集, section: 总集与别集的联合使用, module: M8, page_start: 288, page_end: 309, status: drafting, key_question: 同一作品见于总集和别集时如何比较？, summary: 记录两本编纂年代、所据来源、篇题、文字和编次差异，可判断传承关系并支持校勘。, boundary: 总集早出或别集归属明确都只是证据之一，不能单项决定优劣。, concept_ids: [c_zongji, c_bieji, me_collection_source_analysis, c_variant], quiz_ids: [q-ch11-002, q-ch11-008], lab_ids: [lab-11-case-001]}
