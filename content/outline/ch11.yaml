items:
  - {id: mku-11-01-01, chapter: 11, chapter_title: 总集与别集, section: 一、总集, subsection: 总集与选集, module: M8, page_start: 288, page_end: 295, status: pending_review, key_question: 总集可以按哪些范围汇编，又为何分为选集与全集？, summary: 总集汇集多位作家的诗文词曲，可按文体、时代、地域、家族、流派或唱和题咏范围组织；从编辑方法看则分为选集与全集。, boundary: 收录范围与编辑方法是两套分类角度，不能把“一代之作”直接等同于全集。, concept_ids: [c_zongji, c_xuanji, c_collection_editorial_selection], quiz_ids: [q-ch11-001, q-ch11-005], lab_ids: [lab-11-case-001]}
  - {id: mku-11-01-02, chapter: 11, chapter_title: 总集与别集, section: 一、总集, subsection: 选集举要, module: M8, page_start: 288, page_end: 295, status: pending_review, key_question: 阅读代表选集为什么要同时看编选宗旨与实际收录？, summary: 选集为免读者遍览众多别集而删汰繁芜；代表选本各有文体、时代与审美取舍，同时承担保存亡佚作品和相关资料的作用。, boundary: 选本的保存价值不表示其归属、文字或版本无需复核，实际收录还应与序例和他本互证。, concept_ids: [c_xuanji, c_collection_compilation, me_collection_source_analysis], quiz_ids: [q-ch11-002, q-ch11-006], lab_ids: [lab-11-case-001]}
  - {id: mku-11-01-03, chapter: 11, chapter_title: 总集与别集, section: 一、总集, subsection: 全集举要, module: M8, page_start: 295, page_end: 301, status: pending_review, key_question: 全集型总集为何仍要结合出处、补编和校记使用？, summary: 全集以网罗既定范围内诗文、零篇残句为目标，主要供研究查检；具体总集仍可能有遗漏、误收、重出或校订问题，后续补编不断扩充成果。, boundary: “全”表明搜集宗旨而非绝对无遗漏，不能仅凭书名跳过版本、出处与补编核查。, concept_ids: [c_quanji_collection, c_collection_compilation, c_document_loss], quiz_ids: [q-ch11-003, q-ch11-007], lab_ids: [lab-11-case-001]}
  - {id: mku-11-02-01, chapter: 11, chapter_title: 总集与别集, section: 二、别集, subsection: 别集的起源, module: M8, page_start: 301, page_end: 302, status: pending_review, key_question: 个人诗文汇编怎样逐渐成为别集？, summary: 先秦虽无成熟别集，诸子成书已有相似形态；汉代目录开始按作家著录赋作，曹丕又曾汇编多人的遗文，汉魏六朝以后别集日益繁盛。, boundary: 与后世文集相似、目录中按作者著录和独立别集成书是不同层次，不应合并为同一时间点。, concept_ids: [c_bieji, c_author_collection_layers, c_textual_agent], quiz_ids: [q-ch11-001, q-ch11-008], lab_ids: [lab-11-case-001]}
  - {id: mku-11-02-02, chapter: 11, chapter_title: 总集与别集, section: 二、别集, subsection: 别集的内容, module: M8, page_start: 302, page_end: 306, status: pending_review, key_question: 别集为何不能只按“纯文学作品集”理解？, summary: 别集以个人诗文为主，诗部可扩展至词曲，文部又包含应用文和经史子方面的学术论说；编排、正集外集、补遗、附件及独立著作构成不同内容层次。, boundary: 戏剧通常独立成书；年谱、他人序跋、附载作品和收入的独立著作不能一律归为题名作者原作。, concept_ids: [c_bieji, c_author_collection_layers, c_collection_compilation], quiz_ids: [q-ch11-004, q-ch11-006], lab_ids: [lab-11-case-001]}
  - {id: mku-11-02-03, chapter: 11, chapter_title: 总集与别集, section: 二、别集, subsection: 别集的文献价值, module: M8, page_start: 306, page_end: 309, status: pending_review, key_question: 别集除保存文学作品外还提供哪些材料？, summary: 别集既是研究作家、作品与流派的主要材料，也可借编年诗、交游唱和、学术诗文、题跋考辨和传记附件研究生平轨迹与学术问题，并保存他人佚作。, boundary: 原书强调材料潜力；进一步判断一条记载是否可靠，仍属于网站提出的来源分析步骤。, concept_ids: [c_collection_documentary_value, me_collection_source_analysis, c_author_collection_layers], quiz_ids: [q-ch11-005, q-ch11-007], lab_ids: [lab-11-case-001]}
  - {id: mku-11-03-01, chapter: 11, chapter_title: 总集与别集, section: 总集与别集的联合使用, module: M8, page_start: 288, page_end: 309, status: drafting, key_question: 同一作品见于总集和别集时如何比较？, summary: 网站据本章多处异文、辑佚和编集层次案例设计联合使用法：先核版本与责任者，再记录篇题、文字、编次和来源差异，形成可复查的阶段判断。, boundary: 这是依据原书案例提炼的教学方法，不是原书单列章节；总集早出或别集归属明确都不能单项决定文本优劣。, concept_ids: [c_zongji, c_bieji, me_collection_source_analysis, c_variant], quiz_ids: [q-ch11-002, q-ch11-008], lab_ids: [lab-11-case-001]}
