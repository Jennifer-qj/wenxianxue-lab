items:
  - {id: mku-06-01-01, chapter: 6, chapter_title: 文献的校勘, section: 一、文献讹误的类型及校勘的目的, subsection: 讹、脱、衍、倒、错乱, module: M6, page_start: 134, page_end: 137, status: pending_review, key_question: 五类讹误如何从表面症状区分？, summary: 讹是字形误变，脱是缺失，衍是多出，倒是次序颠倒，错乱则涉及较大范围的结构混乱。, boundary: 错字形态只是诊断入口，不能脱离异本和语境直接改字。, concept_ids: [c_textual_error, c_variant], quiz_ids: [q-ch06-001, q-ch06-005], lab_ids: [lab-06-case-001]}
  - {id: mku-06-01-02, chapter: 6, chapter_title: 文献的校勘, section: 一、文献讹误的类型及校勘的目的, subsection: 校勘的目的, module: M6, page_start: 137, status: pending_review, key_question: 校勘为什么不等于追求唯一“原文”？, summary: 校勘旨在认识文本差异、尽量恢复较可靠文字并公开判断依据，同时保留无法解决的问题。, boundary: 现存证据通常只能支持有限结论，不能把推测伪装成原貌。, concept_ids: [c_collation, c_suspensive_judgment], quiz_ids: [q-ch06-002, q-ch06-008], lab_ids: [lab-06-case-001]}
  - {id: mku-06-02-01, chapter: 6, chapter_title: 文献的校勘, section: 二、校勘应具备什么条件, subsection: 主观条件与精研本书, module: M6, page_start: 137, page_end: 141, status: pending_review, key_question: 校勘者需要哪些知识和判断纪律？, summary: 文字语言、文体、史实和专门知识构成主观条件，对全书体例与思想的熟悉能约束局部判断。, boundary: 博闻不能替代证据记录，熟悉作者也不能成为臆改理由。, concept_ids: [c_collation, c_suspensive_judgment], quiz_ids: [q-ch06-003, q-ch06-007], lab_ids: [lab-06-case-001]}
  - {id: mku-06-02-02, chapter: 6, chapter_title: 文献的校勘, section: 二、校勘应具备什么条件, subsection: 广求异本与相关资料, module: M6, page_start: 138, page_end: 140, status: pending_review, key_question: 为什么底本之外还要广求异本和旁证？, summary: 异本呈现传承分歧，相关引文、类书和同类材料可补充传本未保留的信息。, boundary: 异本数量多不等于多数文字必真，应考察各本亲缘与证据独立性。, concept_ids: [c_variant, c_evidence_chain], quiz_ids: [q-ch06-004, q-ch06-006], lab_ids: [lab-06-case-001]}
  - {id: mku-06-03-01, chapter: 6, chapter_title: 文献的校勘, section: 三、校书的主要方法, subsection: 对校法与他校法, module: M6, page_start: 141, page_end: 146, status: pending_review, key_question: 对校和他校分别依赖什么材料？, summary: 对校比较同书传本，他校借助他书征引与相关材料；二者常协同发现并解释异文。, boundary: 他书引文也可能节改或误抄，不能未经评估直接替换底文。, concept_ids: [me_duijiao, me_tajiao, c_variant], quiz_ids: [q-ch06-001, q-ch06-004], lab_ids: [lab-06-case-001]}
  - {id: mku-06-03-02, chapter: 6, chapter_title: 文献的校勘, section: 三、校书的主要方法, subsection: 本校法与综合考证法, module: M6, page_start: 146, page_end: 147, status: pending_review, key_question: 没有可靠异本时怎样形成可检验判断？, summary: 本校从全书内部寻找体例和复文，综合考证则把内部线索与语言、史实和版本证据组成证据链。, boundary: 仅凭文意顺畅的理校风险较高，必须说明推理步骤和不确定性。, concept_ids: [me_benjiao, me_synthesis_collation, c_evidence_chain], quiz_ids: [q-ch06-003, q-ch06-006], lab_ids: [lab-06-case-001]}
  - {id: mku-06-04-01, chapter: 6, chapter_title: 文献的校勘, section: 四、校勘成果的处理及校勘记的写法, module: M6, page_start: 147, page_end: 149, status: pending_review, key_question: 一条可复核的校勘记要包含什么？, summary: 校勘记应交代底文、异文来源、证据、取舍和处理方式，使读者能够复查。, boundary: 只给改后文字而隐去异文和依据，会破坏研究的可复核性。, concept_ids: [c_collation_note, c_evidence_chain], quiz_ids: [q-ch06-005, q-ch06-007], lab_ids: [lab-06-case-001]}
  - {id: mku-06-05-01, chapter: 6, chapter_title: 文献的校勘, section: 五、校书的态度：多闻阙疑, module: M6, page_start: 149, page_end: 150, status: pending_review, key_question: 什么时候应当保留原文或存疑？, summary: 当异本、语境和旁证不能形成充分一致的解释时，应标明疑点而不强行改定。, boundary: 阙疑不是放弃研究，而是把证据限度准确写入结论。, concept_ids: [c_suspensive_judgment, c_collation_note], quiz_ids: [q-ch06-002, q-ch06-008], lab_ids: [lab-06-case-001]}
