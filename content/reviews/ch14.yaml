    evidence_note: "文字稿第三册行1731—1735；目录定位后记第414页起。后记交代2001年出版至2006年六次印刷、入选规划教材和2007年修订，逐项列出第一、四、五、七至十四章的修改，并坦言准确性与前沿性受时间和学养限制。项目已把它明确为全书版本史料和网站编辑单元，而非第十四章正文。纸本终审需核对后记实际起止页、十一项内容、日期及署名地点。"
