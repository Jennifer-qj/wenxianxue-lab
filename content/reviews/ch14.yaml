    reviewed_at: "2026-09-10"
    evidence_note: "文字稿第三册行1273—1385；目录定位第379—388页。原书介绍十五种敦煌目录及五种论著目录，逐书比较中英法俄日等馆藏范围、编号、分类和著录字段，并反复指出不全、重复、遗漏、题名错误及详略差异。项目已从抽象‘跨馆去重’改为目录体例和覆盖范围判断。纸本终审需逐书核对中外文题名、编者、年代、号码、数量和版本。"
