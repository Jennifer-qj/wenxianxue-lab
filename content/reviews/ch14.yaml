    evidence_note: "文字稿第三册行1579—1655、1667—1699；目录定位第400—410页。原书将语言材料分为韵书音注、俗文学韵脚、字书字形和俗语词；史地部分列传世亡佚史籍、寺院及官私文书与地志；子部列传世与佚书写本；文学再分文人创作与九类俗文学。项目已撤回‘非正统日常文本’的笼统标签。纸本终审需核对书卷编号、异文、字数篇数、体裁定义和校辑成果。"
