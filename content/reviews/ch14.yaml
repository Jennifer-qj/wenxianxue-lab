    evidence_note: "文字稿第三册行1525—1577；目录定位第396—400页。原书先说明佛教文献约占九成并举逸经、三阶教、禅宗北宗，再列道教、摩尼教、景教材料；儒家经籍部分用《尚书》《诗经》《论语》等异文及郑玄佚注说明校勘辑佚价值。项目删除了未经展开的讲诵实践，并把材料比例外推限制标为网站提醒。纸本终审需核对百分比、写本编号、篇名、异文和辑复比例。"
