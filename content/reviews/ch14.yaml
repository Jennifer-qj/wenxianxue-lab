    evidence_note: "文字稿第三册行1387—1523；目录定位第388—396页。原书由叶昌炽、王仁俊、罗振玉早期刊布写起，择要介绍综合影印、佛经、地理、社会经济、法制、医药、韵书、古籍、俗文学、题记及石窟图册等二十一类成果。项目删去原书未写的数字平台，把摘要落实到各书的图像、录文、题解、校记、考释和索引。纸本终审需核对书名卷册、编者、出版年、编号数量与完成情况。"
