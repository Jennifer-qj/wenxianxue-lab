chapter: 14
edition: 杜泽逊《文献学概要（修订本）》，中华书局2008年版
source_requirement: paper_copy
note: 第14章及修订本后记已完成带页码文字稿预对读；以下记录用于公开定位、提问和留痕，任何条目都必须回到实体纸本后才能改为已核验。
items:
  - unit_id: mku-14-01-01
    page_start: 368
    page_end: 371
    focus:
      - 核对敦煌地理沿革、丝路位置与历史分期
      - 核对敦煌石窟八处组成、莫高窟位置规模及洞窟编号
      - 核对藏经洞作为洪晉影堂及第十六窟耳洞的形制
    required_checks: [page_range, names_dates, summary_fidelity, boundary_strength, linked_content]
    status: in_review
    reviewer: Codex（文字稿预对读）
    reviewed_at: "2026-09-10"
    evidence_note: "文字稿第三册行1159—1199；目录定位第368—371页。原书依次解释敦煌、敦煌石窟、莫高窟和藏经洞：敦煌位于河西走廊西端，敦煌石窟为八处石窟总称，莫高窟是代表，藏经洞则是十六窟耳洞、今第十七窟。项目已把‘核心遗址之一’改成原书用语和具体层级。纸本终审需核对地名沿革、路线、石窟数量、年代、面积与洪晉姓名字形。"
  - unit_id: mku-14-02-01
    page_start: 371
    page_end: 372
    focus:
      - 核对王圆禄姓名异写、发现年月日和两件当事期材料
      - 比较荐疏、功德碑、1931年墓志及其他早期记述
      - 检查1900年结论是否说明史料形成先后与直接关系
    required_checks: [page_range, names_dates, summary_fidelity, boundary_strength, linked_content]
    status: in_review
    reviewer: Codex（文字稿预对读）
    reviewed_at: "2026-09-10"
    evidence_note: "文字稿第三册行1203—1217；目录定位第371—372页。原书以《王道士荐疏》和光绪三十二年功德碑为与王圆禄直接相关的较可信材料，再以叶昌炽、斯坦因、伯希和、罗振玉近时记述旁证1900年；1931年墓志所记相差一年而可信度较低。项目删去本节未写的移动交易和实物编号。纸本终审需核对日期、碑名、引文、王圆禄异写及馆藏。"
  - unit_id: mku-14-02-02
    page_start: 372
    page_end: 375
    focus:
      - 核对斯坦因废弃说与伯希和避难说的证据
      - 核对荣新江对原始包裹、卷帙制度、三界寺及历史背景的论证
      - 区分1002年纪年下限、封闭年代推测和封闭原因判断
    required_checks: [page_range, names_dates, summary_fidelity, boundary_strength, linked_content]
    status: in_review
    reviewer: Codex（文字稿预对读）
    reviewed_at: "2026-09-10"
    evidence_note: "文字稿第三册行1219—1229；目录定位第372—375页。原书先列废弃说、避难说，再详述荣新江利用斯坦因早期记录、包裹帙号、三界寺标记及1006年于阗覆亡背景提出的解释，并判断荣说更有说服力、方法值得借鉴。项目已补回三方证据差异，同时保留“推测”层级。纸本终审需核对外文姓名、年代、包裹数量、寺名、题记编号和引文出处。"
  - unit_id: mku-14-02-03
    page_start: 375
    page_end: 379
    focus:
      - 核对1900至1925年遗书与艺术品流散时间线
      - 核对斯坦因、伯希和、大谷队、奥登堡、华尔纳所得数量和去向
      - 核对1910年劫余卷运京、沿途损失和国内分藏情况
    required_checks: [page_range, names_dates, summary_fidelity, boundary_strength, linked_content]
    status: in_review
    reviewer: Codex（文字稿预对读）
    reviewed_at: "2026-09-10"
    evidence_note: "文字稿第三册行1233—1271；目录定位第375—379页。原书从地方官员分取、清点封存未果写起，逐年叙述斯坦因、伯希和、日本大谷队、奥登堡和华尔纳等取得文献文物，以及1910年劫余卷运京途中被盗分拆。项目撤回把数字重聚写成流散的正面结果，并保留原书明确的责任措辞。纸本终审需核对日期、箱卷数量、编号范围、机构更名、人物译名与陈寅恪引语。"
