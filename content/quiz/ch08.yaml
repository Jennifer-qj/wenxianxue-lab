items:
  - {id: q-ch08-001, chapter: 8, type: true_false, concept_ids: [c_lost_work, c_forged_work], prompt: 一部书今天不见传本，就能直接断定它从未存在且必为伪书。, answer: false, explanation: 亡佚与作伪是不同问题，应查目录、引文和传承记录。}
  - {id: q-ch08-002, chapter: 8, type: matching, concept_ids: [c_reconstruction, c_forgery_technique], prompt: 将工作或手段与说明配对。, pairs: [{left: 辑佚, right: 从散见材料重建亡书}, {left: 伪撰序跋, right: 制造虚假的来源说明}, {left: 缀合群书, right: 拼合旧材料冒充新整体}], explanation: 相同的“汇集材料”外观可能属于研究性辑佚，也可能服务于身份伪造，关键在说明是否诚实。}
  - {id: q-ch08-003, chapter: 8, type: ordering, concept_ids: [me_reconstruction_workflow], prompt: 排列辑佚的基本流程。, items: [核定书名篇卷, 广搜引文, 鉴别真伪和重复, 校订编排, 逐条注明出处], answer: [0,1,2,3,4], explanation: 出处透明使重建过程可复核，也便于未来增删。}
  - {id: q-ch08-004, chapter: 8, type: classification, concept_ids: [c_forgery_motive, me_linguistic_authentication], prompt: 将线索归入动机或文本证据。, zones: [作伪动机, 语言文本证据], items: [{label: 射利, zone: 作伪动机}, {label: 逃禁, zone: 作伪动机}, {label: 后起语词, zone: 语言文本证据}, {label: 声韵系统矛盾, zone: 语言文本证据}], explanation: 动机解释可能性，文本证据检验实际身份，两者不能混为一谈。}
  - {id: q-ch08-005, chapter: 8, type: multiple_choice, concept_ids: [c_forgery_technique, me_historical_authentication], prompt: 哪些现象可能构成时代错置线索？, options: [使用晚出的官名, 提及后来的事件, 采用尚未形成的地名, 纸张略有破损, 引用晚出文献], answers: [0,1,2,4], explanation: 制度、史实、地理和称引都可产生年代矛盾，物理破损本身不能断代文本。}
  - {id: q-ch08-006, chapter: 8, type: evidence, concept_ids: [c_lost_work, me_provenance_authentication], prompt: 验证一部亡书曾经存在可使用哪些材料？, evidence_ids: [早期目录著录, 同时代引文, 可靠序跋, 出土残篇, 网络转述], answer_ids: [早期目录著录, 同时代引文, 可靠序跋, 出土残篇], explanation: 独立且年代明确的材料可共同支持存在史，未经核实的转述不能充当核心证据。}
  - {id: q-ch08-007, chapter: 8, type: short_answer, concept_ids: [c_authentication_conclusion, c_evidence_chain], prompt: 为什么一处晚出词不能自动证明全书皆伪？, rubric: [考虑后人改写或窜入, 判断该词覆盖范围, 寻找其他独立证据, 区分局部与整体结论], explanation: 辨伪结论必须与证据作用范围相称。}
  - {id: q-ch08-008, chapter: 8, type: single_choice, concept_ids: [c_forged_work, c_forged_work_value], prompt: 对已经确认晚出的伪书，最合适的使用方式是？, options: [完全销毁, 仍当作所托时代原始史料, 改按实际成书时代研究其语言思想和接受史, 不说明年代直接引用], answer: 2, explanation: 去除伪托身份后，文本仍可能是其实际时代的重要材料。}
  - {id: q-ch08-009, chapter: 8, type: evidence, concept_ids: [me_historical_authentication, c_forged_work_value], prompt: 判断某篇可能后人窜入，应组合哪些证据？, evidence_ids: [篇章用语, 制度称谓, 各版本篇次, 早期引文, 收藏价格], answer_ids: [篇章用语, 制度称谓, 各版本篇次, 早期引文], explanation: 内部年代特征与外部传本证据结合，才能限定窜入范围。}
  - {id: q-ch08-010, chapter: 8, type: fill_blank, concept_ids: [c_reconstruction, c_authentication_conclusion], prompt: 辑佚和辨伪都必须逐条保存材料的____，才能让后人复核。, answers: [出处, 来源], explanation: 可追溯性是两类工作共同的研究底线。}
