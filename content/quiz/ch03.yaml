items:
  - {id: q-ch03-001, chapter: 3, type: single_choice, concept_ids: [c_authorship_zhu, c_textual_agent], prompt: 题名作者最稳妥地说明什么？, options: [现存每字必由其亲写, 文献与该作者存在署名或传统关联且仍需考察形成过程, 后人从未改动, 版本必然最早], answer: 1, explanation: 署名是形成史线索，不是对现存全部文字的自动担保；编定、传抄和后改都需进一步调查。}
  - {id: q-ch03-002, chapter: 3, type: true_false, concept_ids: [c_authorship_shu, me_oral_transmission], prompt: 传述和讲唱都是完全透明、不产生选择的复制。, answer: false, explanation: 记录者和表演者会因对象、语境、记忆和表达方式作出选择，差异既可能是误差，也可能是传统变化。}
  - {id: q-ch03-003, chapter: 3, type: multiple_choice, concept_ids: [c_compilation, c_evidence_chain], prompt: 按本章定义，研究编纂文献应优先追问哪些问题？, options: [材料来自哪里, 依据什么体例排列, 是否注明出处, 原始条文是否改窜, 封面颜色是否醒目], answers: [0,1,2,3], explanation: 编纂依体例缀辑旧文，材料来源、出处和条文处理方式都关系到成果质量；封面颜色不能回答形成问题。}
  - {id: q-ch03-004, chapter: 3, type: matching, concept_ids: [c_buddhist_translation, c_textual_agent], prompt: 将佛典翻译实例与形成方式配对。, pairs: [{left: 安世高译经, right: 本人口述并由他人笔录}, {left: 竺法护译经, right: 有聂承远、聂道真等助手参与}, {left: 鸠摩罗什译场, right: 由政府选派多人协助译经}], explanation: 译经实例显示形成责任可能分布在译师、笔录者、助手和译场组织之间。}
  - {id: q-ch03-005, chapter: 3, type: evidence, concept_ids: [c_scholarly_translation, c_textual_agent], prompt: 判断晚清学术译书的责任分工，哪些材料最有用？, evidence_ids: [书前译者题署, 译例与序跋, 翻译馆职掌记录, 机构译书目录, 书库房间颜色], answer_ids: [书前译者题署, 译例与序跋, 翻译馆职掌记录, 机构译书目录], explanation: 晚清译书常分口译、笔述、校对、画图和刊行等环节，必须结合文献记录区分责任。}
  - {id: q-ch03-006, chapter: 3, type: short_answer, concept_ids: [c_literary_translation, c_textual_agent], prompt: 为什么评价林译小说时必须说明它的形成链条？, rubric: [林纾不懂外文, 他人先作口译, 林纾以文言笔述, 原作可能被增删润饰], explanation: 形成链条既揭示译文并非逐字直译，也帮助具体评价林纾的文学再表达及其影响。}
  - {id: q-ch03-007, chapter: 3, type: classification, concept_ids: [c_authorship_zhu, c_authorship_shu, c_compilation, c_translation], prompt: 将形成方式归类。, zones: [著, 述, 编, 译], items: [{label: 独立撰成新论著, zone: 著}, {label: 记录师说, zone: 述}, {label: 选取旧材料重排, zone: 编}, {label: 跨语言转化, zone: 译}], explanation: 四类是分析框架，真实文献可能兼有多种形成方式。}
  - {id: q-ch03-008, chapter: 3, type: ordering, concept_ids: [c_textual_lifecycle, c_transmission_error], prompt: 排列一条可能的传播链。, items: [口头讲述, 记录成写本, 据写本刊刻, 摄影复制], answer: [0,1,2,3], explanation: 每次转换都可能保留、改变或丢失信息，因此应记录各节点及所据底本。}
  - {id: q-ch03-009, chapter: 3, type: fill_blank, concept_ids: [c_textual_agent], prompt: 作者、编者、译者、抄手和刻工都可视为文献形成与传播的____。, answers: [参与者, 行动者], explanation: 强调参与者能帮助我们看见成品背后的多阶段劳动和选择。}
  - {id: q-ch03-010, chapter: 3, type: evidence, concept_ids: [me_hand_copying, c_textual_lifecycle], prompt: 哪些实例能说明印刷普及后抄写仍是重要流布方式？, evidence_ids: [红楼梦先有抄本流传, 四库全书抄写多部, 不少古书仅有抄本传世, 玄奘印普贤像, 相纸颜色], answer_ids: [红楼梦先有抄本流传, 四库全书抄写多部, 不少古书仅有抄本传世], explanation: 先抄后印、大型工程依靠抄写和孤传抄本，分别说明抄写并未因印刷普及而消失。}
  - {id: q-ch03-011, chapter: 3, type: single_choice, concept_ids: [me_printing, c_evidence_chain], prompt: 关于中国印刷术的发明年代，哪种表述最符合本章的证据判断？, options: [东汉说已经确证, 隋代说有无可争议实物, 中晚唐实物只能证明当时已有印刷，结合更早线索可认为初唐至盛唐说相对可信, 北宋以前没有印刷], answer: 2, explanation: 发明时间不能直接等同于现存实物年代；本章比较记载和实物后，以有限语气支持初唐至盛唐说。}
  - {id: q-ch03-012, chapter: 3, type: short_answer, concept_ids: [me_photographic_reproduction, c_research_boundary], prompt: 本章所说的色盲缩微胶卷可能造成什么信息损失？, rubric: [滤去底灰可提高文字清晰度, 浅色印记可能被滤掉, 颜色较淡的批点可能被滤掉, 说明结论针对当时技术], explanation: 摄影复制有保护和利用价值，但成像处理也会选择性丢失原件上可见的信息。}

