items:
  - {id: q-ch02-001, chapter: 2, type: single_choice, concept_ids: [m_oracle_bone, m_paper], prompt: 下列哪种判断最符合载体研究方法？, options: [只读文字内容, 同时观察材料、加工、书写和出土环境, 只凭颜色断代, 默认现状就是原装], answer: 1, explanation: 载体是文献证据的一部分，需要把材料、制作、文字和流传环境合看；单一外观线索通常不足以完成断代或形制判断。}
  - {id: q-ch02-002, chapter: 2, type: multiple_choice, concept_ids: [m_bronze, c_scroll_binding], prompt: 哪些因素会直接影响载体上的文本解释？, options: [器物功能, 文字位置, 制作方式, 书写次序, 研究者喜欢的颜色], answers: [0,1,2,3], explanation: 文本并非悬浮存在，器类、空间位置、加工和阅读次序都会提供语境；个人审美不能作为解释证据。}
  - {id: q-ch02-003, chapter: 2, type: classification, concept_ids: [m_stone, m_palm_leaf, c_butterfly_binding], prompt: 将形态特征放入合适类别。, zones: [摩崖, 贝叶, 蝴蝶装], items: [{label: 直接刻于天然石壁, zone: 摩崖}, {label: 叶片穿孔并以夹板固定, zone: 贝叶}, {label: 版心向内折叠, zone: 蝴蝶装}], explanation: 三者分别体现石壁空间、叶片材料和纸叶折叠方式。分类时应依据结构特征，而不是仅凭名称联想。}
  - {id: q-ch02-004, chapter: 2, type: ordering, concept_ids: [m_bamboo_wood, c_slip_binding, c_accordion_binding], prompt: 按材料加工到成册的逻辑排列简策步骤。, items: [加工简片, 书写或预留编绳位置, 按次序编联, 卷束收存], answer: [0,1,2,3], explanation: 这是基本工作逻辑；实物显示先写后编与先编后写均可能存在，因此第二、第三步在具体材料中需要依痕迹判断。}
  - {id: q-ch02-005, chapter: 2, type: matching, concept_ids: [m_silk, m_papyrus, c_thread_binding], prompt: 将载体或形制与特征配对。, pairs: [{left: 帛, right: 适合文字与绘图}, {left: 莎草纸, right: 茎片排列压制}, {left: 线装, right: 打孔穿线装订}], explanation: 配对抓住材料加工和装订结构的核心差异；这些特征只是识别入口，真实鉴定仍需观察实物和后期改装。}
  - {id: q-ch02-006, chapter: 2, type: true_false, concept_ids: [m_parchment, m_stone, c_scroll_binding], prompt: 世界各地载体都沿着完全相同的时间顺序演变。, answer: false, explanation: 不同地区材料资源、技术传播和文化传统各异，莎草纸、羊皮纸、简帛和植物纤维纸具有不同时间线，不能合并成单线进步史。}
  - {id: q-ch02-007, chapter: 2, type: evidence, concept_ids: [m_bronze, c_wrapped_back_binding], prompt: 判断一件载体的具体类型，哪些观察最有直接证据价值？, evidence_ids: [材质, 加工痕迹, 文字位置, 内部折叶结构, 展柜灯光颜色], answer_ids: [材质, 加工痕迹, 文字位置, 内部折叶结构], explanation: 材质与结构痕迹直接来自对象，灯光颜色会改变视觉印象。证据还需记录观察条件，必要时借助规范书影或检测。}
  - {id: q-ch02-008, chapter: 2, type: short_answer, concept_ids: [m_oracle_bone, m_palm_leaf, c_carrier_constraint], prompt: 任选甲骨或贝叶，说明材料怎样影响文字布局和保存方式。, rubric: [指出至少一项材料性质, 连接到书写或装订方式, 说明保存或解读风险], explanation: 合格回答需要建立“材料性质—制作与书写—保存或解释后果”的因果链，而非只背诵载体名称。}
  - {id: q-ch02-009, chapter: 2, type: fill_blank, concept_ids: [c_slip_binding, c_accordion_binding], prompt: 简牍编绳断裂可能导致文本____发生变化。, answers: [次序, 顺序], explanation: 单简脱离原有编联后，重建次序成为整理关键；这说明物质损坏能够直接转化为文本结构问题。}
  - {id: q-ch02-010, chapter: 2, type: evidence, concept_ids: [m_silk, m_parchment, c_carrier_constraint], prompt: 比较帛与羊皮纸时应选择哪些维度？, evidence_ids: [原料, 加工方式, 书写性能, 保存条件, 名称字数], answer_ids: [原料, 加工方式, 书写性能, 保存条件], explanation: 跨文化比较应使用可解释的物质维度，名称字数没有证据意义；比较结果还应尊重各自历史语境。}
  - {id: q-ch02-011, chapter: 2, type: short_answer, concept_ids: [c_butterfly_binding, c_wrapped_back_binding, me_material_reading], prompt: 面对疑似后改装古书，怎样区分现装与原装线索？, rubric: [检查折痕和版心方向, 观察打孔与裁切痕迹, 比较纸色和修补, 保留不确定表述], explanation: 外观可能来自后期装订，内部结构和不同时期痕迹更关键；若证据不足，应说明“现装为何、原装待考”。}
  - {id: q-ch02-012, chapter: 2, type: single_choice, concept_ids: [ev_paper_invention, c_thread_binding, c_material_anachronism], prompt: 画秦代故事时直接画线装书，主要问题是什么？, options: [颜色不好看, 载体形制与目标时代不相容, 线装书不能写字, 所有历史图都不能想象], answer: 1, explanation: 这是载体时代错置。历史视觉化可以合理想象，但必须受时代材料知识约束，并在证据不足时避免过度具体。}
