items:
  - {id: q-ch10-001, chapter: 10, type: matching, concept_ids: [c_local_gazetteer, c_genealogy], prompt: 将文献与主要组织中心配对。, pairs: [{left: 地方志, right: 一定地域及其综合事项}, {left: 家谱, right: 宗族世系及其成员记录}], explanation: 两者可能相互引用，但基本组织中心不同。}
  - {id: q-ch10-002, chapter: 10, type: true_false, concept_ids: [c_genealogical_lineage, c_document_loss], prompt: 家谱世系图连续，就能证明每一代记录都同样可靠且从未补接。, answer: false, explanation: 修谱可能追补远祖、合并支系或填补缺代，需结合谱序、谱例和旁证。}
  - {id: q-ch10-003, chapter: 10, type: classification, concept_ids: [c_gazetteer_type], prompt: 将方志归入行政层级或专题地域类型。, zones: [行政层级志, 专题或特殊地域志], items: [{label: 省志, zone: 行政层级志}, {label: 县志, zone: 行政层级志}, {label: 边关志, zone: 专题或特殊地域志}, {label: 盐井志, zone: 专题或特殊地域志}], explanation: 类型决定资料范围，也提示应使用何种地理边界。}
  - {id: q-ch10-004, chapter: 10, type: multiple_choice, concept_ids: [c_gazetteer_value, c_genealogy_structure], prompt: 方志和家谱可能提供哪些研究材料？, options: [地理沿革, 人物传记, 诗文, 移民线索, 自动无偏的完整人口], answers: [0,1,2,3], explanation: 两类文献资料丰富，却都有收录立场和缺失，不能直接当作完整人口数据库。}
  - {id: q-ch10-005, chapter: 10, type: classification, concept_ids: [c_genealogy_structure, c_gazetteer_type], prompt: 将栏目归入家谱或地方志。, zones: [家谱, 地方志], items: [{label: 世系录, zone: 家谱}, {label: 宗规家训, zone: 家谱}, {label: 建置沿革, zone: 地方志}, {label: 山川形胜, zone: 地方志}], explanation: 栏目可相互借鉴，但其放置语境和编纂目的不同。}
  - {id: q-ch10-006, chapter: 10, type: evidence, concept_ids: [me_local_source_crosscheck, c_local_source_bias], prompt: 核查某家族迁徙记载可组合哪些材料？, evidence_ids: [不同时期家谱, 原居地与迁入地方志, 墓志碑刻, 户籍档案, 家族传说单一口述], answer_ids: [不同时期家谱, 原居地与迁入地方志, 墓志碑刻, 户籍档案], explanation: 多种独立且时间明确的材料可以互证，孤立传说应保留为待核线索。}
  - {id: q-ch10-007, chapter: 10, type: ordering, concept_ids: [c_genealogy_structure, me_local_source_crosscheck], prompt: 排列阅读一部家谱的建议顺序。, items: [读谱序和谱例, 识别修谱年代与人员, 阅读世系结构, 抽取目标人物事件, 与外部材料互证], answer: [0,1,2,3,4], explanation: 先理解编纂规则，才能正确解释具体记录和缺失。}
  - {id: q-ch10-008, chapter: 10, type: short_answer, concept_ids: [c_administrative_geography, c_genealogy_value], prompt: 为什么研究古代某县人口不能直接套用今天的县界？, rubric: [指出行政区划变化, 核定方志时代辖域, 处理迁入迁出记录, 说明统计口径], explanation: 地理沿革决定人口资料的空间分母，边界不一致会造成错误比较。}
