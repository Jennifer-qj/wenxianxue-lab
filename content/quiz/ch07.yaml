items:
  - {id: q-ch07-001, chapter: 7, type: single_choice, concept_ids: [c_bibliography, c_bibliographic_abstract], prompt: 能最充分体现传统目录学术功能的是哪一项？, options: [只列价格, 既著录书目又撰提要和类序, 只按颜色排书, 只统计页数], answer: 1, explanation: 提要和类序使目录能够揭示一书内容及学术源流。}
  - {id: q-ch07-002, chapter: 7, type: matching, concept_ids: [c_public_catalog, c_private_catalog, c_dynastic_bibliography], prompt: 将目录类型与主要证据范围配对。, pairs: [{left: 公藏目录, right: 国家或公共机构所藏}, {left: 私藏目录, right: 私人收藏及其中常见的鉴定题跋}, {left: 史志目录, right: 一代藏书或一朝著述的史书著录}], explanation: 先辨编制主体和收录范围，才能判断一条“不著录”意味着什么。}
  - {id: q-ch07-003, chapter: 7, type: classification, concept_ids: [c_subject_catalog, c_special_catalog], prompt: 将目录归类。, zones: [专科目录, 特种目录], items: [{label: 经学目录, zone: 专科目录}, {label: 集部目录, zone: 专科目录}, {label: 禁毁目录, zone: 特种目录}, {label: 版本图录, zone: 特种目录}], explanation: 专科按知识领域组织，特种目录围绕特定研究或管理任务。}
  - {id: q-ch07-004, chapter: 7, type: multiple_choice, concept_ids: [c_bibliographic_entry], prompt: 一条较完整的传统目录著录可包含哪些项目？, options: [书名篇卷, 撰人朝代, 版本, 提要, 天气], answers: [0,1,2,3], explanation: 这些项目共同识别文献并提供内容与版本线索。}
  - {id: q-ch07-005, chapter: 7, type: true_false, concept_ids: [c_bibliographic_classification], prompt: 近现代分类法比四部分类法先进，因此研究古籍时应完全取代四部法。, answer: false, explanation: 两种分类法适应不同时期的文献与学术结构，应按对象和需要并行使用，不能作简单的先进、落后判断。}
  - {id: q-ch07-006, chapter: 7, type: ordering, concept_ids: [c_bibliographic_entry, c_bibliographic_abstract], prompt: 排列制作基础书目记录的工作顺序。, items: [核定书名与篇卷, 核查责任者和朝代, 描述版本, 撰写提要, 归入类目], answer: [0,1,2,3,4], explanation: 先识别对象和所据本，再概括内容并安置于知识体系。}
  - {id: q-ch07-007, chapter: 7, type: evidence, concept_ids: [c_special_catalog], prompt: 研究者要确认某版本确曾被编者亲眼看过，哪类目录的证据更直接？, evidence_ids: [知见目录, 经眼目录, 举要目录, 禁毁目录], answer_ids: [经眼目录], explanation: 知见兼收直接所见和间接所知；经眼目录以亲眼所见为范围，在“是否亲见”这一点上证据更直接。}
  - {id: q-ch07-008, chapter: 7, type: short_answer, concept_ids: [c_bibliography, c_bibliographic_abstract], prompt: 为什么说目录可以成为学术史材料？, rubric: [提到分类体系, 提到提要或序, 说明收录与不收录的时代判断, 指出目录自身边界], explanation: 目录通过类目、提要和取舍呈现编者对知识结构及学术源流的理解。}
