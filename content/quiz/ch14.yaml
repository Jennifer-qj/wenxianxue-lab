items:
  - {id: q-ch14-001, chapter: 14, type: matching, concept_ids: [c_dunhuang, c_mogao_caves, c_library_cave], prompt: 将概念与层级配对。, pairs: [{left: 敦煌, right: 地域与城市}, {left: 莫高窟, right: 石窟遗址}, {left: 藏经洞, right: 莫高窟中的特定洞窟空间}], explanation: 区分空间层级能避免把地域、遗址和洞窟混为一谈。}
  - {id: q-ch14-002, chapter: 14, type: ordering, concept_ids: [ev_library_cave_discovery, c_dunhuang_edition], prompt: 按原书叙述排列敦煌遗书从发现到整理刊行的阶段。, items: [1900年藏经洞发现, 遗书流散国内外, 1910年劫余卷运京, 各馆编制目录, 综合影印与专题整理出版], answer: [0,1,2,3,4], explanation: 发现、流散、入藏、编目与刊行是本章依次展开的历史和文献整理阶段。}
  - {id: q-ch14-003, chapter: 14, type: evidence, concept_ids: [c_fragment_reunification, c_suspensive_judgment], prompt: 网站方法训练：证明两残片原属一卷应使用哪些证据？, evidence_ids: [断口吻合, 纸张尺寸, 书手行款, 文意衔接, 题材相同], answer_ids: [断口吻合, 纸张尺寸, 书手行款, 文意衔接], explanation: 这是网站新增的缀合训练，不是原书给出的固定清单；题材相同只能提供宽泛相似性。}
  - {id: q-ch14-004, chapter: 14, type: true_false, concept_ids: [c_dunhuang_dispersal, c_digital_reunification], prompt: 网站延伸判断：数字影像联合展示已经使分散文献在物理上重新回到原藏经洞。, answer: false, explanation: 数字化只能在检索和图像层面建立联系，不改变原书所述实物分藏的历史与现状。}
  - {id: q-ch14-005, chapter: 14, type: multiple_choice, concept_ids: [c_dunhuang_catalog, me_dunhuang_id_resolution], prompt: 定位一件敦煌写卷应记录哪些字段？, options: [收藏机构, 馆藏编号, 旧号对照, 首尾题名与尺寸, 网页背景色], answers: [0,1,2,3], explanation: 机构、编号和内容形态字段共同识别对象。}
  - {id: q-ch14-006, chapter: 14, type: classification, concept_ids: [c_dunhuang_religion, c_dunhuang_secular], prompt: 将材料归入宗教或世俗文献。, zones: [宗教文献, 世俗文献], items: [{label: 佛经写本, zone: 宗教文献}, {label: 道教斋仪, zone: 宗教文献}, {label: 契约文书, zone: 世俗文献}, {label: 变文与诗歌, zone: 世俗文献}], explanation: 分类便于学习，但真实写卷可能混合多种内容。}
  - {id: q-ch14-007, chapter: 14, type: short_answer, concept_ids: [c_dunhuang_edition, me_photographic_reproduction], prompt: 网站方法训练：为什么使用敦煌整理本时要区分影印、录文和校记？, rubric: [影印保留可见字形版面, 录文便于阅读检索, 校记记录整理判断, 重要问题回查原件或高质量图像], explanation: 原书逐书说明图像、录文、校记和考释等不同体例；网站据此要求先辨清所用材料层次。}
  - {id: q-ch14-008, chapter: 14, type: fill_blank, concept_ids: [c_dunhuang_secular], prompt: 原书概括敦煌文学文献的两项主要用途，一是校勘，二是____。, answers: [辑佚], explanation: 敦煌所出总集、别集和单篇作品既能订正文句，也能补出传世集本未收作品。}
