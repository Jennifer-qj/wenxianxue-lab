items:
  - {id: q-ch14-001, chapter: 14, type: matching, concept_ids: [c_dunhuang, c_mogao_caves, c_library_cave], prompt: 将概念与层级配对。, pairs: [{left: 敦煌, right: 地域与城市}, {left: 莫高窟, right: 石窟遗址}, {left: 藏经洞, right: 莫高窟中的特定洞窟空间}], explanation: 区分空间层级能避免把地域、遗址和洞窟混为一谈。}
  - {id: q-ch14-002, chapter: 14, type: ordering, concept_ids: [ev_library_cave_discovery, c_dunhuang_edition], prompt: 排列敦煌文献从发现到现代利用的工作链。, items: [藏经洞重新发现, 遗书分散收藏, 各馆编目编号, 影印释录出版, 联合目录数字关联], answer: [0,1,2,3,4], explanation: 每一阶段都会生成新的来源记录和使用条件。}
  - {id: q-ch14-003, chapter: 14, type: evidence, concept_ids: [c_fragment_reunification, c_suspensive_judgment], prompt: 证明两残片原属一卷应使用哪些证据？, evidence_ids: [断口吻合, 纸张尺寸, 书手行款, 文意衔接, 题材相同], answer_ids: [断口吻合, 纸张尺寸, 书手行款, 文意衔接], explanation: 题材相同只能提供宽泛相似性，多项物质和文本证据才支持同卷关系。}
  - {id: q-ch14-004, chapter: 14, type: true_false, concept_ids: [c_dunhuang_dispersal, c_digital_reunification], prompt: 数字影像联合展示已经使分散文献在物理上重新回到原藏经洞。, answer: false, explanation: 数字化实现的是检索和图像层面的虚拟重聚，不改变实物收藏地点。}
  - {id: q-ch14-005, chapter: 14, type: multiple_choice, concept_ids: [c_dunhuang_catalog, me_dunhuang_id_resolution], prompt: 定位一件敦煌写卷应记录哪些字段？, options: [收藏机构, 馆藏编号, 旧号对照, 首尾题名与尺寸, 网页背景色], answers: [0,1,2,3], explanation: 机构、编号和内容形态字段共同识别对象。}
  - {id: q-ch14-006, chapter: 14, type: classification, concept_ids: [c_dunhuang_religion, c_dunhuang_secular], prompt: 将材料归入宗教或世俗文献。, zones: [宗教文献, 世俗文献], items: [{label: 佛经写本, zone: 宗教文献}, {label: 道教斋仪, zone: 宗教文献}, {label: 契约文书, zone: 世俗文献}, {label: 变文与诗歌, zone: 世俗文献}], explanation: 分类便于学习，但真实写卷可能混合多种内容。}
  - {id: q-ch14-007, chapter: 14, type: short_answer, concept_ids: [c_dunhuang_edition, me_photographic_reproduction], prompt: 为什么研究敦煌写卷要同时看影像和释录？, rubric: [影像保留字形版面, 释录便于阅读检索, 二者都可能有局限, 重要问题回到实物或高质量图像], explanation: 影像与释录是互补的知识表示，不能相互替代。}
  - {id: q-ch14-008, chapter: 14, type: fill_blank, concept_ids: [c_digital_reunification], prompt: 用联合目录和数字图像关联分藏各馆遗书，可称为数字化虚拟____。, answers: [重聚, 重构], explanation: 虚拟重聚让原本分散的材料在研究界面上重新建立联系。}
