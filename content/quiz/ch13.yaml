items:
  - {id: q-ch13-001, chapter: 13, type: true_false, concept_ids: [c_excavated_variant], prompt: 出土写本时代早于今本，就必然等同于该书唯一原本。, answer: false, explanation: 原书强调早期写本可提供可靠新依据；网站进一步提醒，较早的文本见证仍不能自动等同于作者原本。}
  - {id: q-ch13-002, chapter: 13, type: classification, concept_ids: [c_bamboo_silk_text, c_stone_inscription, c_seal_text, c_brick_tile_text], prompt: 将本章材料按载体类别归类。, zones: [简帛, 石刻, 玺印, 砖瓦], items: [{label: 竹简律令, zone: 简帛}, {label: 墓志铭, zone: 石刻}, {label: 官印文字, zone: 玺印}, {label: 瓦当铭文, zone: 砖瓦}], explanation: 原书将简帛、石刻、玺印和砖瓦分别介绍；先分清材料类别，才能继续判断各自的文献价值。}
  - {id: q-ch13-003, chapter: 13, type: evidence, concept_ids: [c_stone_inscription_value], prompt: 原书用《袁安碑》校正《后汉书》纪日时，哪些材料构成关键证据？, evidence_ids: [碑文所记己卯, 史书记作癸卯, 当月朔日干支推算, 拓本收藏价格, 书法是否好看], answer_ids: [碑文所记己卯, 史书记作癸卯, 当月朔日干支推算], explanation: 碑文异文还要与历日推算相合，才能具体说明史传哪一字有误。}
  - {id: q-ch13-004, chapter: 13, type: multiple_choice, concept_ids: [me_excavated_transmitted_comparison], prompt: 按原书，传世古籍的简帛古写本可用于哪些工作？, options: [考证时代与真伪, 校补古书讹脱, 释读古书文义, 自动认定作者原本, 比较传世本异同], answers: [0,1,2,4], explanation: 原书明确列出前三项用途，并以多个古写本与传世本的异同为例；“自动认定原本”超出了证据。}
  - {id: q-ch13-005, chapter: 13, type: matching, concept_ids: [c_book_history_artifact, c_stone_inscription_value], prompt: 将原书所举材料与研究问题配对。, pairs: [{left: 简册篇题位置, right: 收卷方向}, {left: 书刀, right: 刮去错字后重写}, {left: 碑刻别体字, right: 汉字发展演变}, {left: 佛经刻石题记, right: 佛教史}], explanation: 篇题、书写工具、字形和题记分别提供书籍制度、文字学与宗教史证据。}
  - {id: q-ch13-006, chapter: 13, type: ordering, concept_ids: [c_archaeological_context, me_excavated_transmitted_comparison], prompt: 网站方法训练：排列研究新出简帛材料的基础步骤。, items: [记录出土单位, 保存整理实物, 编号摄影释文, 与同批材料组合, 再与传世本比较], answer: [0,1,2,3,4], explanation: 这是网站综合本章材料设计的工作顺序，不是原书列出的固定流程；它要求先保留来源，再进入文本比较。}
  - {id: q-ch13-007, chapter: 13, type: short_answer, concept_ids: [c_book_history_artifact], prompt: 网站方法训练：散简编联为什么不应只凭文意决定？, rubric: [说明简序可能扰动, 利用编绳痕和尺寸, 结合篇题与收卷线索, 保留竞争方案], explanation: 原书提供篇题位置、收卷方向和简长等实物证据；多方案复原是网站据此延伸的训练要求。}
  - {id: q-ch13-008, chapter: 13, type: fill_blank, concept_ids: [me_excavated_transmitted_comparison], prompt: 原书提醒，出土文献要充分发挥作用，仍有赖于对____的熟读深思。, answers: [传世文献], explanation: 新出材料与传世文献不是相互排斥的两套证据，理解任何一方都需要另一方参与。}
