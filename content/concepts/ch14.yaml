items:
  - {id: c_dunhuang, label: 敦煌, type: concept, definition: 位于河西走廊西端、古代丝绸之路南北分岔处的城市与历史区域。, chapter_ids: [ch14], status: pending_review}
  - {id: c_mogao_caves, label: 莫高窟, type: concept, definition: 敦煌石窟的代表性遗址，藏经洞是其第十六窟耳洞、今编号第十七窟。, chapter_ids: [ch14], status: pending_review}
  - {id: c_library_cave, label: 藏经洞, type: concept, definition: 莫高窟中原为洪晉影堂、后封存数万件经卷文书与艺术品的第十七窟。, chapter_ids: [ch14], status: pending_review}
  - {id: ev_library_cave_discovery, label: 藏经洞发现, type: event, definition: 王圆禄于1900年清理流沙时发现藏经洞，相关日期由多种早期史料比较确定。, chapter_ids: [ch14], status: pending_review}
  - {id: c_dunhuang_dispersal, label: 敦煌遗书流散, type: concept, definition: 藏经洞文献被分批取得并分藏国内外机构和私人手中的历史过程。, chapter_ids: [ch14], status: pending_review}
  - {id: c_dunhuang_catalog, label: 敦煌文献目录, type: concept, definition: 按收藏机构、编号、内容和形态著录敦煌文献的检索工具。, chapter_ids: [ch14], status: pending_review}
  - {id: c_dunhuang_edition, label: 敦煌文献整理刊行, type: concept, definition: 以综合影印或专题汇编方式公布敦煌材料，并附录文、题解、校记、考释或索引的工作。, chapter_ids: [ch14], status: pending_review}
  - {id: c_dunhuang_religion, label: 敦煌宗教文献, type: concept, definition: 敦煌遗书中的佛教、道教、摩尼教和景教等宗教文献。, chapter_ids: [ch14], status: pending_review}
  - {id: c_dunhuang_secular, label: 敦煌世俗文献, type: concept, definition: 敦煌遗书中的经籍、语言、史地、子书、文学和科技等非宗教材料。, chapter_ids: [ch14], status: pending_review}
  - {id: c_fragment_reunification, label: 残卷缀合, type: concept, definition: 网站据敦煌残卷整理实例建立的教学模型，用多类物质与文本证据检验残片是否原属同卷。, chapter_ids: [ch14], status: drafting}
  - {id: me_dunhuang_id_resolution, label: 敦煌编号解析, type: method, definition: 通过馆藏缩写、卷号和旧新编号对照定位具体遗书的方法。, chapter_ids: [ch14], status: pending_review}
  - {id: c_digital_reunification, label: 数字化虚拟重聚, type: concept, definition: 以联合目录和数字图像在线关联分藏各处文献的数字人文实践。, chapter_ids: [ch14], status: drafting}
  - {id: c_revision_history, label: 修订说明, type: concept, definition: 作者记录版本修订范围、增删缘由和研究局限的元文献材料。, chapter_ids: [ch14], status: pending_review}
