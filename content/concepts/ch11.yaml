items:
  - {id: c_zongji, label: 总集, type: concept, definition: 汇集多位作家诗文词曲的文献集合，可按文体、时代、地域、家族、流派或特定活动划定范围。, chapter_ids: [ch11], status: pending_review}
  - {id: c_xuanji, label: 选集, type: concept, definition: 为便于阅读和把握要领，按一定标准从多位作者作品中删选精华的总集类型。, chapter_ids: [ch11], status: pending_review}
  - {id: c_quanji_collection, label: 全集型总集, type: concept, definition: 以网罗既定范围内诗文乃至零篇残句为目标、主要供研究查检的总集类型。, chapter_ids: [ch11], status: pending_review}
  - {id: c_bieji, label: 别集, type: concept, definition: 以一位作者的诗文为主体的个人作品汇编，后世内容可涉及经史子集多个方面。, chapter_ids: [ch11], status: pending_review}
  - {id: c_collection_compilation, label: 集部编纂, type: concept, definition: 搜集、选择、分类、编次和校订文学作品的过程。, chapter_ids: [ch11], status: pending_review}
  - {id: c_collection_editorial_selection, label: 选录标准, type: concept, definition: 编者据文体、时代、地域、评价或宗旨决定作品去取的规则。, chapter_ids: [ch11], status: pending_review}
  - {id: c_author_collection_layers, label: 别集成书层次, type: concept, definition: 作者自定、后人编集、正集外集、补遗、传记附件与附载他作等不同责任和形成层次。, chapter_ids: [ch11], status: pending_review}
  - {id: c_collection_documentary_value, label: 集部文献价值, type: concept, definition: 总集别集在保存文学作品、作者活动、学术论说、传记附件及他人佚作等方面的材料价值。, chapter_ids: [ch11], status: pending_review}
  - {id: me_collection_source_analysis, label: 集部来源分析, type: method, definition: 比较总集别集所据材料、编次、异文和删改以追踪作品来源的方法。, chapter_ids: [ch11], status: pending_review}
