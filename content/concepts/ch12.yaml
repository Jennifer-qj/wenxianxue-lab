items:
  - {id: c_oracle_bone_text, label: 甲骨文文献, type: concept, definition: 刊刻在龟甲与兽骨上的殷代占卜刻辞，是出土文字资料的一大类。, chapter_ids: [ch12], status: pending_review}
  - {id: ev_oracle_discovery, label: 甲骨文发现, type: event, definition: 1899年前后安阳小屯所出带字甲骨由药材龙骨转为文物，并经王懿荣等人识别购藏、进入学术研究的过程。, chapter_ids: [ch12], status: pending_review}
  - {id: me_scientific_excavation, label: 科学发掘, type: method, definition: 记录地层、位置、组合关系和遗迹背景的考古发掘方法。, chapter_ids: [ch12], status: pending_review}
  - {id: c_oracle_collection, label: 甲骨材料结集, type: concept, definition: 以拓影、来源和编号公布甲骨，并通过分期、分类、缀合、辨伪、释文或索引组织材料的成果。, chapter_ids: [ch12], status: pending_review}
  - {id: c_oracle_value, label: 甲骨文学术价值, type: concept, definition: 甲骨文在早期汉字、语言、殷商史与地下材料和传世文献互证方法上的价值。, chapter_ids: [ch12], status: pending_review}
  - {id: c_bronze_inscription, label: 金文文献, type: concept, definition: 以青铜器铸刻铭文为中心，并连同器形、纹饰、图像与出土信息共同研究的文献材料。, chapter_ids: [ch12], status: pending_review}
  - {id: c_bronze_corpus, label: 金文汇集考释, type: concept, definition: 通过器形图、铭文拓摹、尺寸、来源、释文、断代、分类和索引组织金文的著录与研究成果。, chapter_ids: [ch12], status: pending_review}
  - {id: c_bronze_value, label: 金文学术价值, type: concept, definition: 金文在语言文字、传世文献释读考订和商周古史研究三个方面的价值。, chapter_ids: [ch12], status: pending_review}
  - {id: c_archaeological_context, label: 出土语境, type: concept, definition: 文物的地层、地点、共存物、组合关系及发掘记录。, chapter_ids: [ch12, ch13], status: pending_review}
  - {id: me_epigraphic_rubbing, label: 铭刻拓本, type: method, definition: 将甲骨或金石表面文字复制为纸本图像以便保存与研究的方法。, chapter_ids: [ch12, ch13], status: pending_review}
